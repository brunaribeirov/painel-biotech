const PE={"pe_pt": ["O XBI (S&P Biotech Select Industry, equal-weight, ~130-150 nomes) praticamente Não tem P/L agregado com significado: a maioria das componentes são small/mid-caps de biotech pre-receita ou deficitarias (clinical-stage). Na soma, os lucros agregados são negativos ou próximos de zero, entao o P/L 'agregado' fica N/A ou distorcido; provedores marcam essas holdings como 'NE' (no earnings). Multiplos de P/L não servem para avaliar XBI, o mercado usa cash runway, valor de pipeline, EV/vendas ou probabilidade de sucesso clínico.", "Para o lado LUCRATIVO (large-cap biopharma), o P/L volta a fazer sentido. O IBB (Nasdaq Biotech, cap-weight, dominado por Amgen, Gilead, Vertex, Regeneron, AbbVie) e as large-caps de biopharma negociam em forward P/E na casa de ~15 a 18x em 2026, historicamente comprimido versus o premio 'de plataforma' visto em 2021.", "Big pharma (S&P Pharmaceuticals / large-cap pharma tipo Merck, Pfizer, J&J, AbbVie) negocia com DESCONTO relevante frente ao S&P 500: forward P/E de large-cap pharma ~18.7x segundo Zacks (out/2025), mas grande parte das majors fica em ~14 a 17x, próximo do maior desconto vs. mercado em ~30 anos, pressionado por patent cliffs, precos (IRA/Trump) e M&A.", "Ponto de comparacao 2026: S&P 500 forward P/E ~20x (20.0-20.4x, FactSet/GuruFocus, ago/2026), acima da media de 5 e 10 anos. Ou seja: large biopharma/IBB e big pharma negociam ABAIXO do mercado; o XBI não e comparavel por P/L.", "Ancoras históricas (2015 a 2026, aproximadas): biotech chegou a premios altos em 2014 a 2015 (IBB forward P/L ~20x+ e small-caps esticadas); o estouro de 2016 e o urso de 2021 a 2023 derrubaram valuations; em 2025 a 2026 o forward P/L do segmento biomedico/genetica convergiu para ~20x, praticamente EM LINHA com o S&P 500 (o 'premio de biotech' desapareceu). Series consistentes de P/L de índice para 2015/2018/2021 são dificeis de obter porque o denominador (lucro) foi negativo em varios pontos."], "pe_anchors": {"ibb_fwd_pe_2026": "~16 a 18x (large-cap biopharma; segmento biomedico/genetica ~20x em out/2025)", "big_pharma_fwd_pe_2026": "~15 a 18x (large-cap pharma ~18.7x Zacks; majors frequentemente 14 a 17x, desconto vs. mercado)", "sp500_fwd_pe_2026": "~20x (20.0-20.4x, ago/2026)"}, "indices": [{"ticker": "XBI", "nome": "SPDR S&P Biotech ETF (S&P Biotechnology Select Industry Index)", "o_que_pt": "Biotech dos EUA em <b>equal-weight</b> (~130 a 150 nomes reponderados). Cada componente pesa pouco, então dá muita exposição a <b>small e mid-caps clinical-stage e pré-receita</b>. É a <b>aposta mais pura em risco de biotech</b> que existe: muito sensível a resultado de ensaio clínico, IPO e M&amp;A, e de <b>alta volatilidade</b>. Não tem P/L agregado útil (muitas empresas sem lucro) e não inclui pharma mega-cap.", "tipo": "equal-weight"}, {"ticker": "IBB", "nome": "iShares Biotechnology ETF (Nasdaq Biotechnology Index)", "o_que_pt": "Biotech dos EUA em <b>cap-weight</b>, restrito às listadas na Nasdaq. <b>Dominado pelas grandes lucrativas</b> (Amgen, Gilead, Vertex, Regeneron, AbbVie). <b>Menos volátil que o XBI</b> e com P/L que faz sentido. Não inclui a Eli Lilly, que é pharma e listada na NYSE.", "tipo": "cap-weight"}, {"ticker": "ARKG", "nome": "ARK Genomic Revolution ETF", "o_que_pt": "Fundo <b>ativo</b> (não segue índice) focado em genômica, edição gênica, medicina de precisão e diagnóstico. Aposta temática de inovação, <b>mais concentrada e mais cara</b> (taxa alta). A performance é muito ligada ao <b>apetite por disrupção</b>.", "tipo": "temático"}, {"ticker": "FBT", "nome": "First Trust NYSE Arca Biotechnology Index Fund", "o_que_pt": "Cerca de <b>30 líderes de biotech</b> em equal-weight modificado (NYSE Arca Biotechnology Index). <b>Mais concentrado que o XBI</b>, mas ainda dá peso relevante a nomes menores e clinical-stage. Equilibra biotechs grandes e pequenas.", "tipo": "equal-weight"}, {"ticker": "PBE", "nome": "Invesco Biotechnology & Genome ETF", "o_que_pt": "Biotech e genoma dos EUA seguindo índice próprio (peso modificado por faixas). <b>Mistura biotech e genômica</b>, e é <b>menor e menos negociado</b> que XBI e IBB.", "tipo": "equal-weight"}, {"ticker": "XLV", "nome": "Health Care Select Sector SPDR Fund", "o_que_pt": "Saúde <b>ampla</b> dos EUA em cap-weight: pharma, biotech, devices, managed care e life sciences. <b>Não é um fundo de biotech</b>, é dominado por mega-caps de pharma e saúde (Eli Lilly ~15,5%, J&amp;J, AbbVie, UnitedHealth, Merck). Captura o tema obesidade e GLP-1 justamente <b>por causa do peso enorme da Lilly</b>.", "tipo": "amplo"}, {"ticker": "XPH", "nome": "SPDR S&P Pharmaceuticals ETF (S&P Pharmaceuticals Select Industry Index)", "o_que_pt": "Pharma dos EUA em equal-weight. Dá <b>mais peso a pharma mid-cap e specialty</b> do que os fundos cap-weight. A Lilly entra, mas <b>com peso pequeno</b>, então também não é o melhor para capturar o efeito Mounjaro.", "tipo": "equal-weight"}, {"ticker": "IXJ", "nome": "iShares Global Healthcare ETF (S&P Global 1200 Health Care)", "o_que_pt": "Saúde <b>global</b> em cap-weight (EUA mais Europa e Japão: Roche, Novartis, Novo Nordisk, AstraZeneca, além das americanas). É o <b>mais próximo de um proxy global</b> de saúde e biopharma. <b>Não existe índice de biotech puro global e líquido</b>, porque biotech é muito concentrado nos EUA, então biotech global acaba fino e dominado por nomes americanos. O IXJ inclui a Novo Nordisk, a outra líder de GLP-1.", "tipo": "amplo"}], "melhores_pt": ["Para o RISCO/BETA puro de biotech (clinical-stage, small-caps, catalisadores de ensaios): XBI e o benchmark de referência, equal-weight, mais representativo do 'sentimento' de biotech e o mais usado/líquido. Se quiser um pouco menos de risco de cauda, IBB (cap-weight) por ser ancorado nas grandes lucrativas.", "Para EXPOSICAO A Saúde/BIOPHARMA de forma diversificada e com nomes lucrativos: XLV (amplo, cap-weight) ou IXJ (global). Não são 'biotech' no sentido estrito, mas capturam melhor os grandes vencedores comerciais (ex.: GLP-1).", "Não ha um bom índice de biotech GLOBAL/ex-US: o setor e ultra concentrado nos EUA, entao qualquer 'global biotech' e raso e US-heavy. O mais viavel para tese global e um fundo de saúde global (IXJ), que ao menos inclui Novo Nordisk, Roche, Novartis, AstraZeneca."], "mounjaro_index_pt": ["O efeito Mounjaro e da obesidade foi puxado pela <b>Eli Lilly (LLY)</b>, e a Lilly é classificada como <b>pharma</b>, não biotech, e é <b>mega-cap</b>. Logo, os índices que melhor capturaram o boom são os que carregam <b>muita LLY</b>: acima de tudo a própria LLY, e depois o <b>XLV</b>, onde a Lilly é a maior posição, com ~15 a 16% do fundo.", "No <b>S&amp;P 500</b> a Lilly também pesa (~1,5 a 2%), então até o índice amplo pegou parte do movimento, <b>mas diluído</b>. Em saúde, o <b>XLV foi o veículo listado que mais se beneficiou</b> do rerating da Lilly.", "Quem quase <b>não capturou</b>: o <b>XBI</b>, equal-weight de biotech, onde a Lilly nem faz parte (é pharma, não biotech) e, mesmo se fizesse, o equal-weight limitaria o peso a &lt;1%. O <b>IBB</b> também não tem Lilly, que é listada na NYSE e classificada como pharma. Por isso XBI e IBB <b>ficaram para trás</b> justamente quando o tema obesidade dominou os retornos de saúde.", "Pesos aproximados da Lilly em 2026: <b>XLV ~15,5%</b>, a maior holding, contra <b>XBI ~0%</b> e <b>IBB ~0%</b>, ambos sem a ação. Até o XPH, pharma equal-weight, carrega a Lilly com peso pequeno. Ou seja, o gap de performance entre saúde e biotech de 2023 a 2026 é em boa parte a história de <b>tinha Lilly ou não tinha</b>."], "sources": ["https://www.ssga.com/us/en/intermediary/etfs/state-street-spdr-sp-biotech-etf-xbi", "https://www.ishares.com/us/products/239699/ishares-biotechnology-etf", "https://finbox.com/ARCA:XBI/explorer/pe_ltm/", "https://stockanalysis.com/etf/xlv/holdings/", "https://companiesmarketcap.com/the-health-care-select-sector-spdr-fund/holdings/", "https://finance.yahoo.com/news/4-large-cap-pharma-stocks-133900059.html", "https://www.capitalgroup.com/institutional/insights/articles/pharma-innovation-at-discount.html", "https://www.gurufocus.com/economic_indicators/57/sp-500-pe-ratio", "https://insight.factset.com/highest-forward-12-month-p/e-ratio-for-the-sp-500-in-more-than-5-years", "https://www.spglobal.com/spdji/en/indices/equity/sp-pharmaceuticals-select-industry-index/", "https://etfdb.com/etf/FBT/", "https://finance.yahoo.com/quote/PBE/", "https://www.fool.com/coverage/etfs/2026/07/21/which-healthcare-etf-is-the-better-buy-ishares-global-ixj-or-first-trust-s-biotech-fbt/", "https://www.spglobal.com/spdji/en/education/article/biotech-brings-life-into-equities-the-sp-biotechnology-select-industry-index/", "https://simplywall.st/markets/us/healthcare/biotech"], "caveats_pt": ["P/L de ETF de biotech e traicoeiro: provedores calculam de formas diferentes (harmonic vs. weighted), excluem ou incluem empresas sem lucro, e valores publicados para o mesmo fundo variam muito (ex.: XBI aparece de ~4.8x a ~19 a 28x conforme metodologia). Use forward P/E do subsetor de large-cap, não P/L de índice inteiro.", "As ancoras de forward P/E (IBB ~16 a 18x, big pharma ~15 a 18x, S&P 500 ~20x) são aproximacoes de ago/2026 a partir de reportagens/agregadores; confirmar no dado ao vivo (FactSet/Bloomberg/pagina do fundo) antes de citar em material formal.", "Pesos de LLY (~15.5% XLV; ausente em XBI/IBB) são de holdings de 2026 e mudam com o preco/rebalanceamento; XLV rebalanceia trimestralmente e já teve regra de capping de mega-caps que pode alterar o peso da LLY.", "Series históricas 2015 a 2026 de P/L de índice são incompletas porque, em varios pontos, o lucro agregado do segmento (especialmente small-cap) foi negativo, tornando o P/L N/A, por isso o texto usa poucos pontos-ancora em vez de uma serie continua.", "Não e recomendacao de investimento; apenas leitura setorial de valuation/índices."]}, MOD={"timeline": [{"year": "2010", "event_pt": "Fundação da Moderna (16/set/2010), incubada pela Flagship Pioneering, com a tese de usar mRNA modificado como plataforma terapêutica ampla.", "note_pt": "A aposta inicial não era vacina: era 'transformar o corpo na própria fábrica de proteínas'. Câncer era só uma das várias indicações teóricas."}, {"year": "2014 a 2016", "event_pt": "Amadurecimento da ciência de neoantígenos: sequenciar o exoma/RNA do tumor barateia e permite desenhar vacinas personalizadas contra as mutações de cada paciente.", "note_pt": "É o pré-requisito científico, sem sequenciamento rápido e barato, a vacina personalizada não escala."}, {"year": "2016", "event_pt": "Merck e Moderna anunciam colaboração (jun/2016) para vacinas de câncer personalizadas de mRNA combinadas com Keytruda; upfront de US$ 200 milhões.", "note_pt": "O 'bet' antecipado: a dona do maior anti-PD-1 do mundo pagou para casar seu checkpoint com o mRNA anos antes de qualquer dado de eficácia."}, {"year": "2017", "event_pt": "Prova de conceito acadêmica: os grupos de Ugur Sahin (BioNTech) e de Harvard/Dana-Farber publicam na Nature vacinas de neoantígeno personalizadas em melanoma.", "note_pt": "Dois papers na Nature no mesmo mês validam o conceito biológico, não era aposta de uma única empresa."}, {"year": "2020 a 2021", "event_pt": "Vacinas COVID de mRNA (Moderna e Pfizer/BioNTech) provam a plataforma em escala global: segurança, fabricação, regulatório e velocidade validados em bilhões de doses.", "note_pt": "O 'unlock' decisivo: de tecnologia de nicho a plataforma industrial comprovada e financiada. Reduziu drasticamente o risco técnico do programa de câncer."}, {"year": "2022", "event_pt": "Set/2022: a Merck exerce a opção (+US$ 250 mi). Dez/2022: o KEYNOTE-942 (Fase 2b) atinge o endpoint, ~44% menos recorrência/morte com a vacina + Keytruda vs Keytruda sozinho.", "note_pt": "Primeira demonstração de eficácia de uma vacina de mRNA contra câncer em ensaio randomizado, o 'momento GLP-1' da tese."}, {"year": "2023", "event_pt": "Dados de 3 anos confirmam durabilidade (~49% de redução); publicação formal no Lancet; início da Fase 3 em melanoma adjuvante (INTerpath-001).", "note_pt": "Passa de sinal para tese consolidada; o FDA concede Breakthrough Therapy e começa a corrida por indicações maiores."}, {"year": "2024 a 2025", "event_pt": "Fase 3 de melanoma (INTerpath-001) totalmente recrutada; início da Fase 3 em câncer de pulmão (NSCLC); ativo renomeado para intismeran autogene.", "note_pt": "Ampliação para indicações de altíssimo volume (NSCLC), onde está o verdadeiro tamanho de mercado."}, {"year": "2026", "event_pt": "19/ago/2026: a Fase 3 INTerpath-001 (intismeran + Keytruda em melanoma) foi POSITIVA, a 1ª Fase 3 bem-sucedida de uma vacina de câncer de mRNA. A ação saltou +177% no dia (market cap ~US$25bi → ~US$69bi). Antes, em jun/2026 (ASCO), os dados de 5 anos do KEYNOTE-942 já sustentavam ~49% de redução de recorrência.", "note_pt": "O 'momento GLP-1' da tese, realizado: saiu de sinal de Fase 2 para prova de Fase 3. Daqui, o mercado passa a precificar a replicabilidade em outros tumores (NSCLC, bexiga, rim)."}], "leading_indicators_pt": ["O 'bet' da Merck em 2016 (upfront de US$ 200 mi) foi o sinal institucional mais precoce: a líder mundial em imuno-oncologia comprou opcionalidade sobre mRNA para cancro anos antes de qualquer dado de eficácia, um observador atento já podia flaggar a convicao de um insider dominante.", "A prova de conceito científica ficou visivel em 2017, com dois papers simultaneos na Nature (Sahin/BioNTech e Harvard/Dana-Farber) mostrando que vacinas de neoantigeno personalizadas geram imunidade real em melanoma, o conceito biológico deixou de ser especulativo.", "Programas paralelos independentes (BioNTech tocando sua própria vacina personalizada de mRNA) mostravam que a tese não dependia de uma única empresa, convergencia de multiplos players e um sinal classico de que uma plataforma esta amadurecendo.", "A validacao da plataforma pela COVID em 2020 a 2021 foi o de-risking decisivo e observavel em tempo real: fabricação em escala, seguranca em bilhões de doses, aceitacao regulatória e capital abundante. Quem entendeu que a COVID era um teste de estresse da PLATAFORMA (não um produto isolado) tinha o mapa para as indicacoes adjacentes, cancro a frente.", "O ponto de inflexão onde um observador afiado teria máxima assimetria: fim de 2020/inicio de 2021, plataforma provada pela COVID + ciência de neoantigeno madura (2017) + parceiro comprometido (Merck 2016), mas ANTES do readout do KEYNOTE-942 (dez/2022) que reprecificou tudo. Todos os ingredientes visiveis, mas o mercado ainda só pagava pela história da COVID.", "O exercicio da opção pela Merck em set/2022 (mais US$ 250 mi) foi um sinal de 'smart money' semanas antes do readout publico de dezembro, um insider aumentando a aposta pouco antes do catalisador."], "pattern_pt": ["Rima forte com o GLP-1: em ambos, uma plataforma amadureceu quietamente por uma decada numa indicacao 'ancora' (GLP-1 em diabetes; mRNA em vacinas infecciosas/COVID) antes de uma prova de conceito adjacente destravar uma indicacao gigantesca (obesidade no GLP-1; cancro no mRNA). O 'beta' estava disponível para quem via a plataforma, não o produto.", "O catalisador de reprecificacao e analogo: assim como os dados de perda de peso do STEP/SURMOUNT transformaram a percepção do GLP-1, o readout do KEYNOTE-942 (dez/2022, ~44% de redução de recorrência) foi o dado único que converteu ceticismo em tese de consenso.", "Diferenca-chave de execução: o GLP-1 e um produto de prateleira, escalavel para dezenas de milhões com uma única molécula; a vacina de cancro e personalizada (fabricada por paciente a partir do sequenciamento do tumor), o que impoe complexidade logistica, de custo e de escala muito maiores, o 'TAM' pode ser enorme mas a curva de adocao e mais dependente de manufatura sob medida.", "Diferenca de horizonte e risco: a obesidade teve confirmacao clínica relativamente rapida e endpoint simples (peso); a oncologia exige seguimento longo (3, 5 anos de sobrevida livre de recorrência) e depende de combinação com checkpoint inhibitors, a tese leva mais tempo para maturar e carrega mais risco binario de fase 3, mesmo com o sinal de fase 2 forte."], "status_2026_pt": "Em 19/ago/2026 a tese teve sua PROVA DE FASE 3: a INTerpath-001 (intismeran + Keytruda) foi positiva em melanoma adjuvante, a primeira Fase 3 bem-sucedida de uma vacina de câncer de mRNA. A ação subiu +177% num dia (US$25bi → US$69bi), com short squeeze de ~US$5,5bi. Falta a submissão regulatória/aprovação e a replicação em tumores de alto volume (NSCLC), além do desafio de escala da fabricação personalizada, mas o degrau confirmou o padrão 'plataforma madura + prova de conceito adjacente'.", "sources": ["https://news.modernatx.com/news/news-details/2016/merck-and-moderna-announce-strategic-collaboration-to-advance-novel-mrna-based-personalized-cancer-vaccines-with-keytruda-pembrolizumab-for-the-treatment-of-multiple-types-of-cancer", "https://www.merck.com/news/merck-and-moderna-announce-exercise-of-option-by-merck-for-joint-development-and-commercialization-of-investigational-personalized-cancer-vaccine/", "https://www.merck.com/news/moderna-and-merck-announce-mrna-4157-v940-an-investigational-personalized-mrna-cancer-vaccine-in-combination-with-keytruda-pembrolizumab-met-primary-efficacy-endpoint-in-phase-2b-keynote-94/", "https://www.thelancet.com/journals/lancet/article/PIIS0140-6736(23)02268-7/abstract", "https://www.merck.com/news/moderna-merck-announce-3-year-data-for-mrna-4157-v940-in-combination-with-keytruda-pembrolizumab-demonstrated-sustained-improvement-in-recurrence-free-survival-distant-metastasis-free-su/", "https://www.merck.com/news/moderna-and-merck-present-5-year-data-for-intismeran-autogene-in-combination-with-keytruda-pembrolizumab-in-patients-with-high-risk-stage-iii-iv-melanoma-following-complete-resection-at-the-20/", "https://www.nature.com/articles/nature23003", "https://www.nature.com/articles/nature22991", "https://www.flagshippioneering.com/companies/moderna", "https://www.cancernetwork.com/view/mrna-vaccine-pembrolizumab-shows-sustained-5-year-rfs-in-high-risk-melanoma"], "caveats_pt": ["O sinal principal (KEYNOTE-942) e de fase 2b com apenas 157 pacientes, desenho open-label; forte, mas ainda não e a confirmacao definitiva que só a fase 3 randomizada dara.", "Os números de redução de risco (~44% no readout de 2022, ~49% em 3 e 5 anos) referem-se a sobrevida livre de recorrência/morte na combinação com KEYTRUDA, não a monoterapia da vacina, o beneficio e do conjunto vacina + checkpoint inhibitor.", "Escala e custo da fabricação personalizada (uma vacina por paciente) são riscos reais de execução ainda não resolvidos comercialmente; diferente de um produto de molécula única como o GLP-1.", "Comparacao com o GLP-1 e analogia de padrão (plataforma + prova de conceito adjacente), não equivalencia econômica: o tamanho de mercado, a velocidade de adocao e o perfil regulatório da oncologia são estruturalmente diferentes.", "Este material e histórico/analitico e não constitui recomendacao de investimento."]}, OBMA={"why_inhouse_won_pt": ["Moat de plataforma: Novo e Lilly acumularam ~2-3 DECADAS de know-how em peptideos/incretinas (Novo vem da insulina e da linha de GLP-1 desde exenatide/liraglutide/semaglutide; Lilly do GIP/GLP-1 até tirzepatida). Esse conhecimento tacito de sequenciamento de peptideos, meia-vida, tolerabilidade GI e titulacao de dose não se compra num único ativo em fase tardia, o adquirente compra a molécula, mas não a curva de aprendizado nem o pipeline de próxima geração que a sustenta.", "Vantagem de primeiro entrante e escala comercial: Wegovy e Zepbound/Mounjaro construiram marca, cobertura de payors, relacionamento medico e dados de mundo real (inclusive desfechos cardiovasculares, ex. SELECT) enquanto os retardatarios ainda estao em Fase 1/2. Quando Pfizer, Roche e AZ chegarem ao mercado, os incumbentes já terao contratos, formulario e franquia de marca estabelecidos.", "Execução clínica: os in-house dominam desenhos de ensaio, endpoints e o dialogo regulatório para obesidade/cardiometabolico, e já provaram eficácia+seguranca em larga escala. Ativos licenciados são apostas de fase inicial com risco de atrito, a própria Roche descontinuou acmopatide (CT-868) e a Pfizer teve fracassos em GLP-1 oral (danuglipron/lotiglipron) antes de comprar a Metsera.", "Os retardatarios estao pagando caro por opções ainda não provadas: Pfizer ~US$10bn na Metsera (PF-3944/MET-097i, ainda em Fase 2b), Roche US$2.7bn na Carmot (CT-388/CT-996), AZ ~US$185M upfront + até US$1.8bn em milestones pela Eccogene (elecoglipron/AZD5004). São compras de recuperacao de terreno com retorno incerto, não lideranca organica.", "Compra em fase tardia não gera pipeline autossustentavel: os in-house já iteram para a próxima onda (orais, amilina/CagriSema, triplo-agonista retatrutide da Lilly) a partir da mesma plataforma; o retardatario que compra um único ativo fica dependente de mais M&A para não ficar obsoleto na geração seguinte.", "Assimetria de timing e capital: o valor econômico do boom (margens, precos, participacao) esta sendo capturado agora pelos incumbentes; os adquirentes só devem faturar de forma relevante no fim da decada, competindo contra produtos já baratos, genericos emergentes e franquias entrincheiradas."], "capex_tech_pt": ["Moat de manufatura/CAPEX: sintese de peptideos em escala (semaglutida/tirzepatida) e sobretudo capacidade de fill-finish (envase de injetaveis/canetas) são o verdadeiro gargalo. Novo e Lilly investiram DEZENAS de bilhões em capacidade ANTES da demanda, a Novo Holdings comprou a Catalent por US$16.5bn (dez/2024) e a Novo Nordisk absorveu 3 plantas de fill-finish (Anagni, Bloomington, Brussels) por US$11bn; a Lilly anunciou dezenas de bilhões em novas fábricas nos EUA e Europa.", "Os adquirentes (Pfizer, Roche, AZ) compram molécula, mas não herdam essa base instalada dedicada a incretinas nem a experiencia de scale-up, teriam que construir/contratar capacidade do zero ou disputar CDMOs num mercado já apertado, o que atrasa lancamento e comprime margem. A compra da Catalent pela Novo, alias, tirou capacidade de terceiros do mercado, endurecendo o moat para os rivais.", "Fabricar peptideo com pureza, rendimento e custo competitivos e um ativo tacito de anos de otimizacao de processo; quem chega depois enfrenta curva de custo pior e risco de supply enquanto os líderes já desovam volume e reduzem custo unitario por escala (mesmo que orais de molécula pequena, como ECC5004, mudem parte dessa equacao de custo de produção).", "O gargalo desloca o valor: mesmo com eficácia comparavel (dados de peso de CT-388 e MET-097i são competitivos), sem capacidade de envase na hora certa o retardatario não converte ciência em receita, o moat industrial e tao decisivo quanto o científico."], "will_ai_change_pt": ["O que a IA PODE mudar: baixar a barreira de descoberta/design. Modelagem de proteínas/peptideos, geração in silico de agonistas e otimizacao de meia-vida, seletividade e tolerabilidade podem democratizar o desenho de incretinas de próxima geração e encurtar a parte de 'know-how molecular', erodindo parcialmente o moat de plataforma que hoje protege Novo/Lilly.", "O que a IA Não resolve: o moat fisico. Nenhum modelo constroi plantas de fill-finish, valida linhas sob GMP, garante supply de canetas ou financia dezenas de bilhões em CAPEX. O gargalo de capacidade e de capital continua sendo vantagem de quem investiu antes, a IA não imprime fábricas.", "A IA também Não elimina a execução clínica e regulatória: ensaios de Fase 3 em obesidade/cardiometabolico levam anos, custam bilhões e exigem desfechos de longo prazo (CV, seguranca); IA acelera desenho e recrutamento, mas não contorna o tempo biológico, a exigencia da FDA/EMA nem o risco de atrito, além de não criar de imediato marca, cobertura e escala comercial.", "Balanco: a IA tende a comoditizar a descoberta e estreitar o diferencial científico ao longo do tempo, deslocando ainda mais o valor para os moats de manufatura/capacidade, execução clínica e distribuicao, justamente onde os incumbentes verticalizados (Novo/Lilly) são mais fortes e onde comprar um ativo tardio não basta. Ou seja, a IA muda ONDE esta a vantagem, mas não anula a vantagem de quem controla capacidade e canal."], "sources": ["https://www.biopharmadive.com/news/pfizer-obesity-metsera-phase-2-results-GLP1-monthly-shot/811201/", "https://www.pharmaceutical-technology.com/analyst-comment/jpm26-pfizers-metsera-deal-supercharges-its-obesity-strategy/", "https://www.imperial.ac.uk/news/articles/2025/pfizer-metsera/", "https://www.pharmamanufacturing.com/industry-news/news/55250428/novo-holdings-completes-165b-acquisition-of-catalent", "https://www.dcatvci.org/features/manufacturing-fallout-of-novos-16-5-billion-acquisition-of-catalent/", "https://www.biospace.com/novo-holdings-buys-cdmo-catalent-for-16-5b-to-boost-semaglutide-supply", "https://www.biopharmadive.com/news/roche-obesity-drug-phase-2-data-carmot-glp-gip/810578/", "https://www.fiercebiotech.com/biotech/two-years-after-carmot-buyout-whats-next-roches-expensive-obesity-pipeline", "https://www.contractpharma.com/breaking-news/roche-completes-27b-acquisition-of-carmot-therapeutics/", "https://www.astrazeneca.com/media-centre/press-releases/2023/agreement-with-eccogene-for-clinical-stage-glp-1ra.html", "https://www.fiercebiotech.com/biotech/astrazeneca-after-dumping-one-glp-1-drug-pays-185m-upfront-reenter-oral-obesity-gold-rush", "https://www.businesswire.com/news/home/20260210405505/en/Eccogene-Announces-Positive-Topline-Results-from-Phase-1b-Trial-of-Elecoglipron-AZD5004ECC5004"], "caveats_pt": ["Retornos dos retardatarios ainda são incertos, não necessariamente negativos: dados de peso de CT-388 (Roche, até ~22.5% vs placebo em Fase 2) e MET-097i (Pfizer/Metsera, ~14.1% em 28 semanas) são clinicamente competitivos, a tese e de atraso e risco de execução, não de fracasso científico garantido.", "O mercado de obesidade e grande e ainda pouco penetrado; ha espaco para multiplos vencedores e diferenciacao (mensal vs semanal, oral vs injetavel, combinações com amilina), entao 'catch-up' não significa exclusao permanente.", "Orais de molécula pequena (elecoglipron/ECC5004, e o forglipron da própria Lilly) podem reduzir o moat de manufatura de peptideos, pois são mais baratos e faceis de escalar que injetaveis, isso favorece parte dos retardatarios e relativiza o argumento de CAPEX de envase.", "Valores e status dos ativos são de ~ago/2026 e podem mudar (dados de Fase 3, aprovações, novas descontinuacoes ou M&A). Números de deals incluem componentes de milestone/contingentes (ex.: Pfizer/Metsera 'até ~US$10bn'; AZ/Eccogene US$185M upfront + até US$1.8bn).", "Análise setorial/estratégica, não recomendacao de investimento em nenhuma das empresas citadas."]};
const DAY=86400;
function fmtD(ts){return new Date(ts*1000).toLocaleDateString("pt-BR",{month:"short",year:"2-digit"});}
function fmtDl(ts){return new Date(ts*1000).toLocaleDateString("pt-BR",{day:"2-digit",month:"short",year:"2-digit"});}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");}

/* ===== bar chart ===== */
function bars(data,opts){
  opts=opts||{};const years=Object.keys(data),vals=years.map(y=>data[y]);
  const max=Math.max(...vals.filter(v=>v!=null)),W=560,H=190,padL=42,padR=8,padT=14,padB=22;
  const plotW=W-padL-padR,plotH=H-padT-padB,n=years.length,gap=plotW/n,bw=gap*0.66;
  const Y=v=>padT+(1-v/max)*plotH;const hl=new Set(opts.highlight||[]),pt=new Set(opts.partial||[]);
  let g="";
  for(let i=0;i<=3;i++){const v=max*i/3,y=Y(v).toFixed(1);g+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--border-2)"/><text x="${padL-5}" y="${(+y+3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--muted)" font-family="var(--mono)">${opts.fmt?opts.fmt(v):Math.round(v)}</text>`;}
  years.forEach((yr,i)=>{const v=data[yr];if(v==null)return;const x=padL+gap*i+(gap-bw)/2,y=Y(v),h=padT+plotH-y;
    let f=hl.has(yr)?(opts.hl||"var(--down)"):(opts.color||"var(--accent)");let o=pt.has(yr)?' opacity="0.5"':"";
    g+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h,0).toFixed(1)}" rx="2" fill="${f}"${o}/>`;
    if(n<=13||i%2===0||i===n-1)g+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="8.5" fill="var(--muted)">'${yr.slice(2)}</text>`;});
  if(opts.yoyFrom){years.forEach((yr,i)=>{if(i===0||+yr< +opts.yoyFrom)return;const a=data[years[i-1]],b=data[yr];if(a==null||b==null)return;const pct=(b/a-1)*100,x=padL+gap*i+gap/2,y=Y(b)-9;g+=`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" font-size="9" font-weight="700" fill="${pct>=0?'var(--up)':'var(--down)'}">${pct>0?'+':''}${pct.toFixed(0)}%</text>`;});}
  return `<svg class="v" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
/* ===== static line (small) ===== */
function sline(series,opts){
  opts=opts||{};let pts=series;if(opts.years){const cut=series[series.length-1][0]-opts.years*365*DAY;pts=series.filter(p=>p[0]>=cut);}if(pts.length<2)pts=series;
  const W=opts.W||520,H=opts.H||150,padL=opts.padL||40,padR=8,padT=12,padB=18,n=pts.length,plotW=W-padL-padR,plotH=H-padT-padB;
  const vals=pts.map(p=>p[1]);let mn=Math.min(...vals),mx=Math.max(...vals);const pd=(mx-mn)*0.08||1;mn-=pd;mx+=pd;
  const X=i=>padL+(n===1?0:i/(n-1)*plotW),Y=v=>padT+(1-(v-mn)/(mx-mn))*plotH;
  const up=pts[n-1][1]>=pts[0][1],col=opts.color||(up?"var(--up)":"var(--down)");
  let ln="";for(let i=0;i<n;i++)ln+=(i?"L":"M")+X(i).toFixed(1)+" "+Y(pts[i][1]).toFixed(1)+" ";
  const area=ln+"L"+X(n-1).toFixed(1)+" "+(padT+plotH)+" L"+padL+" "+(padT+plotH)+" Z";
  const gid="s"+Math.round(mn*13%9973)+(up?"u":"d");
  let yl="";[mn+(mx-mn)*.02,mx-(mx-mn)*.02].forEach(v=>{const y=Y(v).toFixed(1);yl+=`<text x="${padL-5}" y="${(+y+3).toFixed(1)}" text-anchor="end" font-size="8.5" fill="var(--muted)" font-family="var(--mono)">${v>=1000?(v/1000).toFixed(0)+'k':Math.round(v)}</text>`;});
  return `<svg class="v" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="${gid}" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="${col}" stop-opacity="0.2"/><stop offset="100%" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>${yl}<path d="${area}" fill="url(#${gid})"/><path d="${ln}" fill="none" stroke="${col}" stroke-width="1.8"/><text x="${padL}" y="${H-5}" font-size="8.5" fill="var(--muted)">${fmtD(pts[0][0])}</text><text x="${W-padR}" y="${H-5}" text-anchor="end" font-size="8.5" fill="var(--muted)">${fmtD(pts[n-1][0])}</text></svg>`;
}
/* ===== multi-line normalized w/ year axis + markers ===== */
function multiLine(seriesList,opts){
  opts=opts||{};const W=720,H=250,padL=34,padR=74,padT=16,padB=24,plotW=W-padL-padR,plotH=H-padT-padB;
  const start=opts.startTs,end=Math.max(...seriesList.map(s=>s.data[s.data.length-1][0]));
  const norm=seriesList.map(s=>{const base=(s.data.find(p=>p[0]>=start)||s.data[0])[1];return{name:s.name,col:s.col,pts:s.data.filter(p=>p[0]>=start).map(p=>[p[0],p[1]/base*100])};});
  let mx=0;norm.forEach(s=>s.pts.forEach(p=>mx=Math.max(mx,p[1])));
  const X=ts=>padL+(ts-start)/(end-start)*plotW,Y=v=>padT+(1-v/mx)*plotH;
  let g="";for(let i=0;i<=4;i++){const v=mx*i/4,y=Y(v).toFixed(1);g+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--border-2)"/><text x="${padL-4}" y="${(+y+3).toFixed(1)}" text-anchor="end" font-size="8.5" fill="var(--muted)" font-family="var(--mono)">${Math.round(v)}</text>`;}
  // year ticks
  const y0=new Date(start*1000).getUTCFullYear(),y1=new Date(end*1000).getUTCFullYear();
  for(let y=y0;y<=y1;y++){const ts=Date.UTC(y,0,1)/1000;if(ts<start)continue;const x=X(ts).toFixed(1);g+=`<text x="${x}" y="${H-6}" text-anchor="middle" font-size="8.5" fill="var(--muted)">${y}</text><line x1="${x}" y1="${padT}" x2="${x}" y2="${padT+plotH}" stroke="var(--border-2)" opacity="0.4"/>`;}
  (opts.marks||[]).forEach(m=>{const x=X(m.ts).toFixed(1);g+=`<line x1="${x}" y1="${padT}" x2="${x}" y2="${padT+plotH}" stroke="var(--ink)" stroke-width="1.2" stroke-dasharray="4 3"/><text x="${x}" y="${padT-4}" text-anchor="middle" font-size="8.5" fill="var(--ink)" font-weight="700">${m.lab}</text>`;});
  norm.forEach(s=>{let ln="";s.pts.forEach((p,i)=>ln+=(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)+" ");g+=`<path d="${ln}" fill="none" stroke="${s.col}" stroke-width="2"/>`;const lp=s.pts[s.pts.length-1];g+=`<text x="${(X(lp[0])+4).toFixed(1)}" y="${(Y(lp[1])+3).toFixed(1)}" font-size="10.5" font-weight="700" fill="${s.col}">${s.name}</text>`;});
  return `<svg class="v" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
/* ===== diverging horizontal bars (contributions), ticker à esquerda, valor à direita ===== */
function diverging(items,opts){
  opts=opts||{};const W=680,rowH=24,padL=66,padR=156,padT=6,padB=6,H=padT+padB+items.length*rowH;
  const mn=Math.min(0,...items.map(i=>i.v)),mx=Math.max(0,...items.map(i=>i.v));
  const zero=padL+(0-mn)/(mx-mn)*(W-padL-padR),X=v=>padL+(v-mn)/(mx-mn)*(W-padL-padR);
  let g=`<line x1="${zero.toFixed(1)}" y1="${padT}" x2="${zero.toFixed(1)}" y2="${H-padB}" stroke="var(--border)"/>`;
  items.forEach((it,i)=>{const y=padT+i*rowH+4,h=rowH-9,col=it.v>=0?"var(--up)":"var(--down)";
    const x0=Math.min(zero,X(it.v)),w=Math.abs(X(it.v)-zero);
    g+=`<rect x="${x0.toFixed(1)}" y="${y}" width="${w.toFixed(1)}" height="${h}" rx="2" fill="${col}"/>`;
    g+=`<text x="6" y="${(y+h/2+3.5).toFixed(1)}" font-size="11" font-family="var(--mono)" font-weight="700" fill="var(--ink)">${it.tk}</text>`;
    g+=`<text x="${(W-padR+8).toFixed(1)}" y="${(y+h/2+3.5).toFixed(1)}" font-size="10" font-family="var(--mono)" fill="${col}">${it.v>0?"+":""}${it.v} p.p. (${it.move>0?"+":""}${it.move}%)</text>`;});
  return `<svg class="v" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
/* ===== overlay de 2 séries anuais, cada uma na sua escala ===== */
function overlay2(A,B,opts){
  opts=opts||{};const years=Object.keys(A),W=560,H=210,padL=30,padR=30,padT=16,padB=22,plotW=W-padL-padR,plotH=H-padT-padB,n=years.length;
  const maxA=Math.max(...years.map(y=>A[y]||0)),maxB=Math.max(...years.map(y=>B[y]||0));
  const X=i=>padL+(n===1?0:i/(n-1)*plotW),YA=v=>padT+(1-v/maxA)*plotH,YB=v=>padT+(1-v/maxB)*plotH;
  let g="";for(let k=0;k<=3;k++){const y=(padT+plotH*k/3).toFixed(1);g+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--border-2)"/>`;}
  years.forEach((yr,i)=>{if(i%2===0||i===n-1)g+=`<text x="${X(i).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="8.5" fill="var(--muted)">'${yr.slice(2)}</text>`;});
  function draw(D,Y,col){let ln="",dots="";years.forEach((yr,i)=>{if(D[yr]==null)return;ln+=(ln?"L":"M")+X(i).toFixed(1)+" "+Y(D[yr]).toFixed(1)+" ";dots+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(D[yr]).toFixed(1)}" r="2.3" fill="${col}"/>`;});return `<path d="${ln}" fill="none" stroke="${col}" stroke-width="2"/>`+dots;}
  g+=draw(A,YA,opts.colA);g+=draw(B,YB,opts.colB);
  return `<svg class="v" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
/* ===== dois eixos: XBI (indexado, esq.) vs série macro (dir.) ===== */
function dualAxis(xbi,right,opts){
  opts=opts||{};const W=560,H=210,padL=36,padR=44,padT=14,padB=22,plotW=W-padL-padR,plotH=H-padT-padB;
  const start=opts.startTs,end=Math.max(xbi[xbi.length-1][0],right[right.length-1][0]);
  const base=(xbi.find(p=>p[0]>=start)||xbi[0])[1];
  const xi=xbi.filter(p=>p[0]>=start).map(p=>[p[0],p[1]/base*100]);
  const lmax=Math.max(...xi.map(p=>p[1])),lmin=0;
  const rr=right.filter(p=>p[0]>=start);let rmin=Math.min(...rr.map(p=>p[1])),rmax=Math.max(...rr.map(p=>p[1]));
  if(opts.rZero)rmin=0;const rp=(rmax-rmin)*0.08||1;rmin-=rp;rmax+=rp;
  const X=ts=>padL+(ts-start)/(end-start)*plotW,YL=v=>padT+(1-(v-lmin)/(lmax-lmin))*plotH,YR=v=>padT+(1-(v-rmin)/(rmax-rmin))*plotH;
  let g="";
  for(let k=0;k<=4;k++){const t=k/4,y=(padT+plotH*t).toFixed(1);g+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--border-2)"/>`;
    g+=`<text x="${padL-3}" y="${(+y+3).toFixed(1)}" text-anchor="end" font-size="7.5" fill="var(--accent)" font-family="var(--mono)">${Math.round(lmax-(lmax-lmin)*t)}</text>`;
    g+=`<text x="${W-padR+3}" y="${(+y+3).toFixed(1)}" text-anchor="start" font-size="7.5" fill="${opts.rightColor}" font-family="var(--mono)">${opts.rfmt?opts.rfmt(rmax-(rmax-rmin)*t):(rmax-(rmax-rmin)*t).toFixed(1)}</text>`;}
  const y0=new Date(start*1000).getUTCFullYear(),y1=new Date(end*1000).getUTCFullYear();
  for(let y=y0;y<=y1;y++){const ts=Date.UTC(y,0,1)/1000;if(ts<start)continue;g+=`<text x="${X(ts).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="7.5" fill="var(--muted)">'${String(y).slice(2)}</text>`;}
  let ln="";xi.forEach((p,i)=>ln+=(i?"L":"M")+X(p[0]).toFixed(1)+" "+YL(p[1]).toFixed(1)+" ");g+=`<path d="${ln}" fill="none" stroke="var(--accent)" stroke-width="2"/>`;
  let rln="";rr.forEach((p,i)=>rln+=(i?"L":"M")+X(p[0]).toFixed(1)+" "+YR(p[1]).toFixed(1)+" ");g+=`<path d="${rln}" fill="none" stroke="${opts.rightColor}" stroke-width="2"${opts.dots?' stroke-dasharray="4 3"':''}/>`;
  if(opts.dots)rr.forEach(p=>g+=`<circle cx="${X(p[0]).toFixed(1)}" cy="${YR(p[1]).toFixed(1)}" r="2.6" fill="${opts.rightColor}"/>`);
  return `<svg class="v" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
/* ===== scatter (loe vs ma) ===== */
function scatter(pairs,opts){
  opts=opts||{};const W=460,H=300,padL=44,padR=14,padT=14,padB=34,plotW=W-padL-padR,plotH=H-padT-padB;
  const xs=pairs.map(p=>p.x),ys=pairs.map(p=>p.y);const xmn=Math.min(...xs),xmx=Math.max(...xs),ymn=0,ymx=Math.max(...ys)*1.05;
  const X=v=>padL+(v-xmn)/(xmx-xmn)*plotW,Y=v=>padT+(1-(v-ymn)/(ymx-ymn))*plotH;
  let g="";for(let i=0;i<=3;i++){const v=ymx*i/3,y=Y(v).toFixed(1);g+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--border-2)"/><text x="${padL-5}" y="${(+y+3).toFixed(1)}" text-anchor="end" font-size="8.5" fill="var(--muted)" font-family="var(--mono)">${Math.round(v)}</text>`;}
  pairs.forEach(p=>{g+=`<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="4" fill="var(--accent)" opacity="0.8"/><text x="${(X(p.x)).toFixed(1)}" y="${(Y(p.y)-7).toFixed(1)}" text-anchor="middle" font-size="8" fill="var(--muted)">'${p.lab}</text>`;});
  g+=`<text x="${(padL+plotW/2).toFixed(1)}" y="${H-4}" text-anchor="middle" font-size="9.5" fill="var(--ink-2)">${opts.xlab||''}</text>`;
  g+=`<text x="10" y="${padT+plotH/2}" transform="rotate(-90 10 ${padT+plotH/2})" text-anchor="middle" font-size="9.5" fill="var(--ink-2)">${opts.ylab||''}</text>`;
  return `<svg class="v" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

  <section><div class="sec-h"><span class="sec-n">04</span><h2>Aprovações e as moléculas de IA</h2></div>
    <div class="read tight"><p>As aprovações do FDA são a <b>etapa final</b>: a autorização de mercado, que só vem <b>depois da Fase 3</b>. Estágios iniciais (pré-clínico e Fase 1) não têm "aprovação", o marco de <b>entrada em humanos</b> é o <b>IND</b> (Investigational New Drug). A sequência completa é <b>IND → Fases 1/2/3 → NDA/BLA → aprovação</b>. Por isso trazemos os dois gráficos: aprovações (a saída) e INDs (a entrada, <b>onde a IA apareceria primeiro</b>).</p></div>

    <div class="read tight"><p>Repare na dinâmica dos INDs: eles <b>caíram no pós-COVID</b> (de 2.068 em 2021 para 1.724 em 2023, com o fim da enxurrada de projetos de vacina), mas <b>voltaram a subir nos últimos dois anos</b>, 1.855 em 2024 e um <b>recorde não-pandêmico de 1.960 em 2025</b>. Essa retomada recente <b>coincide com o boom da IA na descoberta</b> e pode ter relação com ele. Ainda é cedo para cravar, mas a leitura importa: o que entra em Fase 1 hoje é o que vira <b>alvo de aquisição e aprovação daqui a alguns anos</b>. O funil está sendo carregado agora.</p>
      <p>E não é só volume, o relógio encurtou. Segundo a <b>BCG</b> (Jayatunga et al., Drug Discovery Today), a etapa pré-clínica, que vai de achar a molécula até o primeiro teste em pessoas, <b>costumava levar de 4 a 6 anos</b> e nos programas desenhados com IA já aparece em <b>menos de 30 meses</b>. É a parte do ciclo em que a IA de fato encostou a mão.</p></div>
    <div class="qa"><div class="q">2026 está fraco em aprovações, e por que a IA quase não mudou a velocidade?</div><div class="read"><b>2026 (~13) é ANO PARCIAL (YTD ~agosto)</b>, o ritmo é compatível com um ano normal de 40 a 50. Sobre a velocidade: o ciclo de um remédio é de <b>8 a 10 anos</b>, então qualquer efeito da IA só apareceria com muitos anos de defasagem. E a IA, por ora, mostra um impacto apenas na <b>largada</b>. Ou seja, a IA se mostrou promissora para <b>desenhar moléculas mais rapidamente</b>, mas seu impacto na eficácia da molécula <b>só será visto em alguns anos</b>. Tem um fator que pesa aqui: o <b>FDA trocou muito de comando nos últimos meses</b>, então questões políticas e regulatórias, e não só a ciência, podem estar mexendo no ritmo de aprovações de 2026.</div></div>
    <div class="qa"><div class="q">Moléculas feitas com IA: qual o índice de conversão em aprovações? alguma avançou? alguma morreu?</div><div class="read">O funil (ago/2026): <b>~117 a 175 moléculas de IA entraram na clínica → ~60 passaram da Fase 1 → só ~8 completaram a Fase 2 → um punhado em Fase 3 → <b>0 (zero)</b> totalmente aprovadas por IA</b>. A conversão ainda é <b>não comprovada no fim do funil</b>, os primeiros ativos só entraram na clínica em 2021 a 2023, cedo demais para chegar à aprovação (7 a 10 anos).</div></div>
    <div class="card"><h3>Conversão: moléculas de IA vs. biotech tradicional</h3>

      <tr><th>Etapa</th><th>Moléculas de IA</th><th>Tradicional (BIO)</th></tr>
      <tr><td>Sucesso na <b>Fase 1</b> (segurança)</td><td class="v" style="color:var(--up)">~80 a 90%</td><td class="v">~59 a 64%</td></tr>
      <tr><td>Sucesso na <b>Fase 2</b> (eficácia)</td><td class="v">~40%</td><td class="v">~32 a 36%</td></tr>
      <tr><td><b>Fase 1 → aprovação</b> (ponta a ponta)</td><td class="v">projeção ~9 a 18%</td><td class="v">~10 a 14%</td></tr>
      </table></div>
      <div class="read tight" style="margin-top:8px"><p>A IA <b>melhora nitidamente a Fase 1</b> (moléculas mais "druggable"/seguras), mas na <b>Fase 2, onde se testa eficácia, fica ~igual ao histórico</b>. Como <b>nenhuma chegou à aprovação</b>, o ganho ponta-a-ponta é <b>projeção</b> da BCG (de ~5 a 10% para ~9 a 18%), não fato comprovado. Traduzindo: a IA acha moléculas mais rápido e passa melhor pela segurança, mas <b>ainda precisa se provar em fases posteriores</b>.</p></div>

/* ===== interactive line for watch ===== */
const wtips={};
function interactiveLine(host, series, events, opts){
  opts=opts||{};const n=series.length;
  const W=opts.W||340,H=opts.H||130,padL=6,padR=6,padT=14,padB=14,plotW=W-padL-padR,plotH=H-padT-padB;
  const vals=series.map(p=>p[1]);let mn=Math.min(...vals),mx=Math.max(...vals);const pd=(mx-mn)*0.08||1;mn-=pd;mx+=pd;
  const X=i=>padL+(n===1?0:i/(n-1)*plotW),Y=v=>padT+(1-(v-mn)/(mx-mn))*plotH;
  const up=series[n-1][1]>=series[0][1],col=up?"var(--up)":"var(--down)";
  let ln="";for(let i=0;i<n;i++)ln+=(i?"L":"M")+X(i).toFixed(1)+" "+Y(series[i][1]).toFixed(1)+" ";
  const area=ln+"L"+X(n-1).toFixed(1)+" "+(padT+plotH)+" L"+padL+" "+(padT+plotH)+" Z";
  const gid="w"+opts.tk;
  // event markers
  let mk="";(events||[]).forEach((e,idx)=>{
    const ets=Date.parse(e.date)/1000;let i=series.findIndex(p=>p[0]>=ets);if(i<0)i=n-1;if(i<0)return;
    const isup=(e.move||"").indexOf("-")<0;const mc=isup?"var(--up)":"var(--down)";
    mk+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(series[i][1]).toFixed(1)}" r="4.5" fill="var(--surface)" stroke="${mc}" stroke-width="2"/><text x="${X(i).toFixed(1)}" y="${(Y(series[i][1])+3).toFixed(1)}" text-anchor="middle" font-size="8" font-weight="700" fill="${mc}">${idx+1}</text>`;
  });
  host.innerHTML=`<svg class="v" id="svg-${opts.tk}" viewBox="0 0 ${W} ${H}" style="touch-action:none"><defs><linearGradient id="${gid}" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="${col}" stop-opacity="0.18"/><stop offset="100%" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#${gid})"/><path d="${ln}" fill="none" stroke="${col}" stroke-width="1.7"/><line id="cx-${opts.tk}" y1="${padT}" y2="${padT+plotH}" stroke="var(--ink-2)" stroke-dasharray="3 2" style="opacity:0"/><circle id="cd-${opts.tk}" r="3" fill="${col}" style="opacity:0"/>${mk}<text x="${padL}" y="${H-3}" font-size="8" fill="var(--muted)">${fmtD(series[0][0])}</text><text x="${W-padR}" y="${H-3}" text-anchor="end" font-size="8" fill="var(--muted)">${fmtD(series[n-1][0])}</text></svg><div class="wtip" id="tip-${opts.tk}"></div>`;
  const svg=document.getElementById("svg-"+opts.tk),tip=document.getElementById("tip-"+opts.tk);
  const st={series,n,X,Y,W,padL,plotW,first:series[0][1]};
  function move(ev){const r=svg.getBoundingClientRect(),cx=ev.touches?ev.touches[0].clientX:ev.clientX;
    let i=Math.round(((cx-r.left)/r.width*st.W-st.padL)/st.plotW*(st.n-1));i=Math.max(0,Math.min(st.n-1,i));
    const px=st.X(i),py=st.Y(st.series[i][1]);const cr=document.getElementById("cx-"+opts.tk),dt=document.getElementById("cd-"+opts.tk);
    cr.setAttribute("x1",px);cr.setAttribute("x2",px);cr.style.opacity=".5";dt.setAttribute("cx",px);dt.setAttribute("cy",py);dt.style.opacity="1";
    const val=st.series[i][1],ch=(val/st.first-1)*100;
    tip.innerHTML=`<div class="d">${fmtDl(st.series[i][0])}</div><div class="p">US$ ${val}</div><div class="d" style="color:${ch>=0?'var(--up)':'var(--down)'}">${ch>=0?"+":""}${ch.toFixed(0)}% na janela</div>`;
    tip.style.opacity="1";const lp=(px/st.W)*r.width;let tl=lp+10;if(tl>r.width-110)tl=lp-110;tip.style.left=Math.max(2,tl)+"px";tip.style.top="4px";}
  function leave(){const cr=document.getElementById("cx-"+opts.tk),dt=document.getElementById("cd-"+opts.tk);if(cr)cr.style.opacity="0";if(dt)dt.style.opacity="0";tip.style.opacity="0";}
  svg.addEventListener("pointermove",move);svg.addEventListener("pointerleave",leave);svg.addEventListener("touchmove",move,{passive:true});svg.addEventListener("touchend",leave);
}

function caseCard(c){
  const s=c.series,n=s.length,W=330,H=110,padL=4,padR=4,padT=13,padB=11,ev=c.ev_idx;
  const plotW=W-padL-padR,plotH=H-padT-padB,vals=s.map(x=>x[1]);let mn=Math.min(...vals),mx=Math.max(...vals);const pd=(mx-mn)*0.08||1;mn-=pd;mx+=pd;
  const X=i=>padL+i/(n-1)*plotW,Y=v=>padT+(1-(v-mn)/(mx-mn))*plotH,col=c.dir==="up"?"var(--up)":"var(--down)";
  let pre="",post="";for(let i=0;i<n;i++){const cmd=(i===0?"M":"L")+X(i).toFixed(1)+" "+Y(s[i][1]).toFixed(1)+" ";if(i<=ev)pre+=cmd;if(i>=ev)post+=(i===ev?"M":"L")+X(i).toFixed(1)+" "+Y(s[i][1]).toFixed(1)+" ";}
  const evx=X(ev).toFixed(1);
  const svg=`<svg class="v" viewBox="0 0 ${W} ${H}"><line x1="${evx}" y1="${padT}" x2="${evx}" y2="${padT+plotH}" stroke="${col}" stroke-dasharray="3 2" opacity="0.6"/><path d="${pre}" fill="none" stroke="var(--muted)" stroke-width="1.3" opacity="0.7"/><path d="${post}" fill="none" stroke="${col}" stroke-width="1.9"/><circle cx="${evx}" cy="${Y(c.evclose).toFixed(1)}" r="3" fill="${col}"/><text x="${evx}" y="9" text-anchor="middle" font-size="9" font-family="var(--mono)" font-weight="700" fill="${col}">${c.step>0?"+":""}${c.step}%</text></svg>`;

    ${svg}<div class="cwhy"><span class="lbl">${esc(c.event||"")}</span><br>${esc(c.why||"")}</div></div>`;
}

      <div class="read tight" style="margin-top:8px"><p>O que puxa o XBI é <b>específico da biotech, não do mercado amplo</b>. A alta do XBI vem de um <b>punhado de saltos binários</b>, aprovações, dados de Fase 3, aquisições com prêmio, como <b>${A.xbi2026.top[0].tk} (${A.xbi2026.top[0].ytd>0?'+':''}${A.xbi2026.top[0].ytd}%)</b> e <b>${A.xbi2026.top[1].tk} (${A.xbi2026.top[1].ytd>0?'+':''}${A.xbi2026.top[1].ytd}%)</b>. Como o XBI é <b>equal-weight</b>, esses foguetes de small-cap pesam de verdade no índice. É por isso que o XBI pode disparar num ano em que o S&amp;P anda de lado: são <b>motores diferentes</b>. E boa parte desses degraus vem de <b>aquisições com prêmio</b>, o que se torna interessante no momento de queda de patentes.</p></div>

  <section><div class="sec-h"><span class="sec-n">05</span><h2>O efeito Mounjaro e da obesidade</h2></div>

      <div class="read tight"><p>O <b>XBI não tem P/E útil</b>: a maioria das componentes é <b>deficitária</b>, então o lucro agregado é negativo (P/E = N/A). Para biotech clínica o que vale é <b>caixa/runway, valor de pipeline e probabilidade de sucesso</b>, não P/E. Onde o P/E faz sentido, na <b>large-cap lucrativa</b> (IBB, big pharma), o setor negocia <b>abaixo do S&P 500</b> (~16 a 18x vs ~20x): o <b>"prêmio de biotech" de 2021 desapareceu</b>. Ou seja, o setor entra nesse ciclo <b>sem prêmio embutido no preço</b>.</p></div>

      <div class="card"><h3>Novo: da Victoza para Ozempic e Wegovy</h3><div class="read tight"><p>A Victoza (liraglutida, 2010) era injeção diária. A Ozempic (semaglutida, 2017) foi reengenhada para durar uns 7 dias, virou uma aplicação por semana e ficou bem mais potente, tanto no controle da glicose quanto na perda de peso. A semaglutida deixou a liraglutida obsoleta e ainda abriu caminho para a versão oral (Rybelsus) e para a dose alta de obesidade, a Wegovy.</p></div></div>

  <section><div class="sec-h"><span class="sec-n">01</span><h2>A Moderna nos últimos 10 anos</h2></div>
    <div class="card"><h3>Ação da Moderna (MRNA) desde o IPO, base 100</h3><p class="cap">a COVID domina tudo; estão marcados os dois degraus da vacina de câncer, o dado de <b>Fase 2 (+20% no dia, dez/22)</b> e a <b>Fase 3 (+177%, ago/26)</b></p>${multiLine([{name:"MRNA",col:"var(--accent)",data:X.arc}],{startTs:X.arc[0][0],marks:X.arc_marks})}
      <div class="read tight" style="margin-top:6px"><p>A Moderna foi fundada em 2010, abriu capital em dezembro de 2018, virou um fenômeno com a vacina da COVID (2020 e 2021) e depois devolveu quase tudo quando a pandemia passou. O repique no meio de 2024 foi a aprovação da mRESVIA (a vacina de RSV, em maio de 2024), a esperança de um segundo produto, logo revertida quando a empresa cortou a projeção de receita para 2025. A oncologia é a aposta para o próximo ciclo da empresa, mas ainda se encontra pequena perto da onda da COVID. Hoje a MRNA vale cerca de US$ ${X.last}.</p></div>
      <div class="refs"><b>Fontes:</b> Yahoo Finance.</div></div>

  <section><div class="sec-h"><span class="sec-n">02</span><h2>O degrau da vacina de câncer de mRNA (Fase 3, ago/2026)</h2></div>
    <div class="cgrid"><div>${caseCard(X.case)}</div>
      <div class="card"><h3>Foi feito in-house?</h3><div class="read"><p>Sim, é plataforma própria da Moderna. O mRNA-4157 (intismeran autogene) usa a mesma tecnologia de mRNA que a Moderna desenvolve desde 2010, e a vacina é personalizada, fabricada para cada paciente a partir do sequenciamento do próprio tumor. A Merck entra como parceira meio a meio: traz o Keytruda (o remédio com que a vacina é combinada) e divide o custo, mas a plataforma é da Moderna.</p><p>É o mesmo padrão da Lilly e da Novo no GLP-1: quem tem a plataforma dentro de casa captura o valor, com a big pharma pagando pela combinação.</p></div></div>

  <section><div class="sec-h"><span class="sec-n">03</span><h2>Linha do tempo, de 2010 ao resultado</h2></div>
    <div class="card"><div class="tlwrap">${tl}</div><div class="refs"><b>Fontes:</b> Moderna/Merck PRs, Nature (2017), The Lancet (2023), ASCO 2026</div></div>
  </section>
  <section><div class="sec-h"><span class="sec-n">04</span><h2>O "antes" da tese</h2></div>
    <div class="grid2">
      <div class="card"><h3>Os sinais que anteciparam a tese</h3><div class="read tight"><ul class="f">
        <li>A <b>aposta da Merck em 2016</b>, com <b>US$ 200 milhões adiantados</b>: a líder mundial em imuno-oncologia comprou uma <b>opção sobre o mRNA</b> anos antes de existir qualquer dado de eficácia.</li>
        <li>A <b>prova de conceito científica em 2017</b>, com <b>dois trabalhos na Nature</b> (da BioNTech e de Harvard) mostrando que <b>vacinas de neoantígeno geram imunidade de verdade</b> no melanoma.</li>
        <li>A <b>COVID, em 2020 e 2021</b>, <b>validou a plataforma no mundo todo</b> (fabricação, segurança e aval regulatório) e <b>reduziu bastante o risco</b> do programa de câncer.</li>
        <li>A <b>Merck exerceu a opção (mais US$ 250 milhões) em setembro de 2022</b>, poucas semanas antes do resultado sair, <b>um caso claro de quem conhecia o setor entrando pouco antes da virada</b>.</li>
      </ul></div></div>
      <div class="card keybox"><h3>O padrão comparado com o roteiro do GLP-1</h3><div class="read tight"><ul class="f">
        <li>É o mesmo roteiro do GLP-1: a plataforma se firma numa <b>aplicação âncora</b> (o mRNA nas vacinas e na COVID) e depois uma <b>prova de conceito num uso vizinho</b> (o câncer) <b>abre um mercado gigante</b>.</li>
        <li>O catalisador é parecido: assim como o STEP e o SURMOUNT no GLP-1, o <b>KEYNOTE-942, em dezembro de 2022</b>, foi o <b>dado que fez o mercado parar de duvidar</b>.</li>
        <li>A diferença principal é que a <b>vacina é personalizada</b>, uma para cada paciente, <b>bem mais difícil de escalar</b> do que a molécula única do GLP-1.</li>
        <li>E tem <b>mais risco e prazo</b>: oncologia exige <b>acompanhar o paciente por 3 a 5 anos</b> e ainda carrega o <b>risco binário da Fase 3</b>.</li>
      </ul></div></div>
    </div>
    <div class="card keybox"><h3>A replicação da plataforma</h3><div class="read"><p>O ponto central é que a Moderna <b>não precisou provar o mRNA do zero</b> para a vacina de câncer. A COVID, em 2020 e 2021, já tinha provado a plataforma em <b>bilhões de doses</b>: dava para fabricar em escala, com segurança e aval do FDA, e ainda desenhar uma vacina em poucas semanas. A oncologia é <b>a mesma tecnologia apontada para outro alvo</b>: em vez de ensinar o corpo a reconhecer o vírus, ela ensina a reconhecer <b>as mutações do tumor de cada paciente</b>. Ou seja, a Moderna pegou uma plataforma que <b>já era de baixo risco</b> e a reaproveitou numa <b>nova indicação enorme</b>. É justamente esse <b>reaproveitamento de uma plataforma já comprovada</b> que fez o mercado acreditar tão rápido.</p></div></div>
    <div class="card"><h3>Onde a tese está em 2026</h3><div class="read"><p>Em agosto de 2026 a tese deixou de ser uma aposta e virou uma plataforma quase validada, mas o remédio ainda não foi aprovado para venda. Resumindo o que aconteceu:</p>
      <ul class="f">
        <li>No ASCO de junho de 2026 saíram os dados de 5 anos do estudo original (o de Fase 2), e o benefício durou: cerca de 49% menos recorrência ou morte no melanoma. Ou seja, não foi sorte de curto prazo.</li>
        <li>Em agosto de 2026 veio o degrau de +177%: a Fase 3 de melanoma deu certo, a primeira Fase 3 bem-sucedida de uma vacina de câncer de mRNA na história. A Fase 3 é o teste grande e definitivo, e passar nela é o que abre caminho para a aprovação.</li>
        <li>O próximo alvo é o câncer de pulmão (NSCLC), um mercado bem maior que o de melanoma, com os estudos em recrutamento.</li>
      </ul>
      <p>O que ainda pode dar errado é confirmar tudo nas próximas Fases 3 e conseguir fabricar em escala a um custo que feche a conta, porque é uma vacina feita sob medida para cada paciente, bem mais complexa que um remédio de prateleira.</p></div></div>
  </section>`;
