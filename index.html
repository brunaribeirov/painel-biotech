s": "Deals com valor >= US$1bn anunciados no ano (basis mais comparavel entre fontes). FIRMES/quase-firmes: 2024=27, 2025=26 (US$112bn), 2026=33 no 1o semestre (STAT/CNBC; ano cheio deve fechar acima). Anos 2015 a 2023 são ESTIMATIVAS reconstruidas de multiplas fontes (Statista, IQVIA, Fierce, EY) e devem ser tratadas como aproximacoes. 2019 e 2015 foram anos-recorde em VALOR (~US$234 a 250bn e ~US$575bn incl. medtech), não necessariamente em número de transacoes.", "biggest_2026": [{"acquirer": "CVC / GBL (consorcio PE, take-private)", "target": "Recordati", "value": "~US$12.4bn", "sector": "Specialty pharma / doencas raras", "target_type": "public"}, {"acquirer": "Sun Pharmaceutical", "target": "Organon", "value": "~US$11.75bn", "sector": "Saúde da mulher / biosimilares", "target_type": "public"}, {"acquirer": "Merck KGaA (Darmstadt)", "target": "Bio-Techne", "value": "~US$11.3bn", "sector": "Life-science tools / reagentes / terapia celular", "target_type": "public"}, {"acquirer": "AbbVie", "target": "Apogee Therapeutics", "value": "~US$10.9bn", "sector": "Imunologia / inflamacao", "target_type": "public"}, {"acquirer": "GSK", "target": "Nuvalent", "value": "~US$10.6bn", "sector": "Oncologia", "target_type": "public"}, {"acquirer": "Gilead Sciences", "target": "Arcellx", "value": "~US$7.8bn", "sector": "Oncologia (CAR-T)", "target_type": "public"}, {"acquirer": "Merck & Co", "target": "Terns Pharmaceuticals", "value": "~US$6.7bn", "sector": "Oncologia (leucemia)", "target_type": "public"}, {"acquirer": "Biogen", "target": "Apellis Pharmaceuticals", "value": "~US$5.6bn", "sector": "Doencas raras / oftalmologia (complemento)", "target_type": "public"}], "pub_vs_priv_2026": {"public": 9, "private": 6, "note_pt": "Tally sobre o conjunto notavel (~15 maiores deals de 2026). Padrão claro: TODAS as 8 maiores transacoes foram take-outs de empresas de capital ABERTO (biotechs listadas em estagio clínico/comercial). Os alvos PRIVADOS concentram-se nos deals medios/menores (ex.: Eli Lilly comprando Kelonia, Orna, Ajax; Gilead/Tubulis; UCB/Neurona), varios com forte componente de milestones. Números aproximados."}, "why_2019_pt": "2019 foi recorde porque concentrou mega-deals transformacionais (BMS-Celgene ~US$74bn, AbbVie-Allergan ~US$63bn, além do fechamento de Takeda-Shire), impulsionados por caixa repatriado após a reforma tributaria dos EUA, credito barato e a corrida para tapar patent cliffs.", "why_ipo_weak_pt": "A janela de IPO segue seletiva porque investidores generalistas continuam cautelosos após o estouro da bolha de 2021: preferem ativos de estagio avancado já de-riscados, e a própria onda de M&A devolve caixa e sinaliza que vale mais ser comprado por premio do que abrir capital cedo -- só nomes de alta qualidade conseguem IPO enquanto a pharma prefere adquirir ativos comprovados.", "sources": ["https://www.ey.com/en_gl/firepower-report", "https://www.ey.com/en_gl/newsroom/2026/01/life-sciences-m-a-spending-accelerates-as-the-industry-faces-growth-gaps-and-looks-to-ai-and-china-for-innovation", "https://www.statnews.com/2026/06/22/pharma-biotech-ma-boom-2026-deals-total-123-billion/", "https://www.cnbc.com/2026/06/04/biotech-ma-dealmaking-pharma-106-billion.html", "https://www.cnbc.com/2026/06/16/biotech-deals-ipo-pharma-dealmaking-2026.html", "https://www.cnbc.com/2026/06/25/germanys-merck-kgaa-to-buy-bio-techne.html", "https://lifesciencedaily.news/biotech-ma-2026-every-1b-deal-so-far-and-what-is-driving-them/", "https://www.healthcare-brew.com/stories/2026-biggest-healthcare-deals-so-far", "https://www.biospace.com/deals/biotechs-ipo-tide-is-finally-turning-thanks-in-part-to-the-recent-m-a-surge", "https://www.fiercepharma.com/pharma/top-10-biopharma-ma-deals-2024", "https://www.iqvia.com/blogs/2024/01/biopharma-m-and-a-outlook-for-2024", "https://www.statista.com/statistics/1239604/biopharma-ma-deals-number-by-industry/"], "caveats_pt": ["count_basis = deals >= US$1bn. Se a base fosse 'todos os deals divulgados', os números seriam muito maiores (ex.: ~1.353 transacoes pharma/medtech/biotech em 2015; ~100+ deals biopharma/ano recentes). Se fosse '>= US$10bn', seriam ~3-6/ano.", "2015 a 2023 são ESTIMATIVAS reconstruidas; tratar como ordem de grandeza, não contagem exata. 2024=27, 2025=26 e 2026(1S)=33 são os mais firmes.", "2026 = até meados/1o semestre de 2026 (data de corte ~ago/2026); 33 deals >=US$1bn no 1S, ~US$134bn; ano cheio deve superar 2025.", "Valores dos deals são valor de transacao/EV aproximado; alguns (ex.: alvos privados) incluem milestones que inflam o headline.", "Recordati e specialty pharma (não biotech puro) e o deal e take-private por consorcio de PE (CVC/GBL) -- incluido por ser a maior transacao anunciada em life sciences em 2026.", "Organon foi spin-off da Merck & Co, listada na NYSE (OGN) -- alvo publico. Não confundir a 'Merck & Co' (US) com 'Merck KGaA' (Alemanha), acquirers distintos que aparecem ambos na lista.", "Números de deal_count variam conforme fonte/definicao (EY Firepower, IQVIA, DealForma, PwC usam recortes diferentes de setor e de threshold)."]}, AIPROF={"global_ai_series": {"2015": 15.26, "2016": 19.34, "2017": 28.43, "2018": 46.51, "2019": 61.66, "2020": 77.25, "2021": 145.4, "2022": 104.64, "2023": 92.79, "2024": 130.85, "2025": 290.09}, "global_ai_metric_pt": "Investimento privado global em IA (funding externo para empresas privadas de IA com rodadas acima de US$ 1,5 mi), em US$ bilhões/ano. Serie do Stanford HAI AI Index, compilada por Our World in Data (entidade 'World'). Series única e consistente 2015 a 2025; 2025 e valor preliminar/revisado da ediçao 2026 do AI Index.", "ai_biomed_profile": [{"area": "Estrutura de proteínas (AlphaFold)", "biotech_impact_pt": "Impacto já real: prevê estruturas com acurácia quase experimental; usada em virtual screening e desenho de fármacos. Isomorphic (DeepMind) fechou parcerias bilionárias.", "stage_pt": "maduro"}, {"area": "Imagem médica / diagnóstico", "biotech_impact_pt": "A mais consolidada no uso clínico: +1.500 algoritmos aprovados pela FDA (~76% em radiologia). Quase nenhum usa LLM generativo ainda.", "stage_pt": "maduro"}, {"area": "Descoberta de fármacos / química generativa", "biotech_impact_pt": "Muito capital (~US$3,3bi de VC em 2024) e vários candidatos na clínica, mas ainda sem fármaco 'IA-nativo' aprovado. Promessa por validar.", "stage_pt": "emergente"}, {"area": "Genômica / ômicas", "biotech_impact_pt": "Deep learning para variantes, regulação gênica e estratificação de pacientes. Base sólida, mas a tradução para produtos clínicos é lenta.", "stage_pt": "emergente"}, {"area": "NLP clínico / LLMs em saúde", "biotech_impact_pt": "Muita pesquisa e pilotos (resumo de prontuário, apoio à decisão), mas pouca validação real e ~0 LLM aprovado como dispositivo.", "stage_pt": "inicial"}], "findings_pt": ["O investimento privado global em IA e a melhor proxy 'limpa' da tese: sai de ~US$ 15 bi em 2015 para ~US$ 291 bi em 2025 (~19x em 10 anos), com pico intermediario em 2021 (~US$ 145 bi), recuo em 2022 a 2023 e forte reaceleracao em 2024 a 2025 puxada pela IA generativa.", "Dentro de 'IA em biomedicina', a maturidade e desigual: imagem medica/diagnóstico e estrutura de proteínas (AlphaFold) são os pilares MAIS maduros, o primeiro por volume de aprovações regulatorias em uso clínico, o segundo por impacto científico já incorporado ao P&D de fármacos.", "Descoberta de fármacos/química generativa e genômica estao em estagio EMERGENTE: muita traçao e capital, candidatos em ensaios clínicos, mas ainda sem fármaco 'IA-nativo' aprovado e com validacao clínica em curso.", "NLP clínico/LLMs em saúde e o MAIS INICIAL/nascente: enorme interesse e pilotos, porém baixa validacao em dados reais e sem aprovação de LLM generativo como dispositivo clínico até o fim de 2025.", "Sinal de convergencia biotech: parcerias bilionarias (Isomorphic Labs-Novartis/Lilly, Generate:Biomedicines-Novartis) e a primeira orientacao (draft) da FDA em 2025 sobre uso de IA em decisoes regulatorias de fármacos indicam institucionalizacao da tese."], "sources": ["Stanford HAI - The 2025 AI Index Report (capitulo Economy): https://hai.stanford.edu/ai-index/2025-ai-index-report", "Our World in Data - Private investment in AI (serie AI Index, entidade 'World', 2013-2025): https://ourworldindata.org/grapher/private-investment-in-artificial-intelligence", "Businesswire - Stanford HAI 2025 AI Index (investimento corporativo US$ 252,3 bi em 2024): https://www.businesswire.com/news/home/20250407539812/en/", "Drug Discovery News - AlphaFold in Drug Discovery: What It Has and Hasn't Changed: https://www.drugdiscoverynews.com/alphafold-in-drug-discovery-what-protein-structure-prediction-has-and-hasn-t-changed-17348", "PMC - AlphaFold 3 impact in structural biology: https://pmc.ncbi.nlm.nih.gov/articles/PMC13099841/", "R&D World - 6 ways AI reshaped scientific software in 2025 (Boltz-2, RFdiffusion2/3): https://www.rdworldonline.com/6-ways-ai-reshaped-scientific-software-in-2025/", "The Imaging Wire / IntuitionLabs - FDA-cleared AI medical devices (>1.500, ~76% radiologia, final 2025): https://theimagingwire.com/2025/12/10/ai-enabled-medical-devices-granted-fda-marketing-authorization/", "Human Genomics (BMC) - Deep learning applications in human genomics using NGS: https://humgenomics.biomedcentral.com/articles/10.1186/s40246-022-00396-x", "Nature Medicine - LLM-assisted systematic review of LLMs in clinical medicine (2022-2025): https://www.nature.com/articles/s41591-026-04229-5", "MDPI Bioengineering - Large Language Models in Healthcare and Medical Applications: A Review: https://www.mdpi.com/2306-5354/12/6/631"], "caveats_pt": ["A serie de investimento e uma proxy da 'tese de IA' em geral, Não específica de biomedicina; captura o apetite global de capital, não o valor científico ou clínico entregue.", "O AI Index revisa a metodologia (fonte Quid) entre ediçoes; valores absolutos variam de ano para ano de publicação. Usei UMA serie única ('World' da OWID, base AI Index) para garantir consistencia interna; o valor de 2025 (~US$ 291 bi) e preliminar e pode ser revisado.", "Investimento privado exclui M&A, ofertas publicas e gasto de governos/big techs via caixa próprio; o total 'corporativo' do AI Index (US$ 252,3 bi em 2024) e maior por incluir esses itens. Não misturar as duas medidas.", "A classificacao de maturidade (maduro/emergente/inicial) e um julgamento qualitativo agregado de reviews e do fluxo regulatório; ha sobreposicao entre areas (ex.: AlphaFold alimenta a descoberta de fármacos).", "Números de aprovações da FDA e de estudos de LLM referem-se a datas específicas de 2025/inicio 2026 e crescem rapidamente; tratar como fotografia, não como valor estavel.", "Contagem de 'modelos de fundacao por ano' foi descartada como proxy por ser mais ruidosa e dependente de definicao; a serie de investimento foi escolhida por ser mais limpa e continua."]}, AIMOL={"funnel_pt": "Ordem de grandeza (agosto/2026, moléculas AI-native que entraram em ensaios clínicos intervencionais em humanos): trackers da indústria contam ~150-175 programas AI-descobertos em desenvolvimento clínico. Uma análise revisada por pares apresentada no ASCO 2026 contou 117 ativos terapeuticos AI-enabled em 63 empresas que entraram na clínica; destes ~60 (51%) já tinham completado a Fase 1 e apenas 8 (~7%) tinham completado a Fase 2. Em Fase 3 ha um punhado de moléculas (ex.: rentosertib, zasocitinib/TAK-279 ex-Nimbus, mais alguns candidatos). APROVADOS totalmente AI-designed: 0 (zero) até agosto/2026. Resumo aproximado: ~117-175 entraram na clínica -> ~60 passaram/estao além da Fase 1 -> ~8 completaram Fase 2 -> punhado em Fase 3 -> 0 aprovados.", "approved_status_pt": "Não ha, até agosto/2026, nenhum medicamento inteiramente descoberto E desenhado por IA aprovado por FDA/EMA. Os programas mais avancados estao em Fase 2 concluida / Fase 3 em andamento. Nota importante de nomenclatura: 'descoberto por IA' (target/molécula gerados por IA de ponta a ponta, ex. Insilico rentosertib) e diferente de 'otimizado/acelerado por IA' (ex. TYK2 da Nimbus, que usou design computacional/fisica mas não e classicamente 'generative AI de novo'). Sob a definicao estrita de molécula gerada por IA generativa, o marco clínico de maior destaque até hoje e o resultado positivo de Fase 2a do rentosertib (Nature Medicine, jun/2025), a primeira validacao clínica de prova-de-conceito de uma droga desenhada por IA, mas ainda longe de aprovação.", "winners": [{"company": "Insilico Medicine", "drug": "Rentosertib", "indication": "Fibrose pulmonar (IPF)", "stage": "Fase 2a", "note_pt": "Alvo e molécula desenhados por IA generativa; 1ª prova de conceito clínica de droga 'IA-designed' (Nature Medicine, 2025)."}, {"company": "Nimbus → Takeda", "drug": "Zasocitinib", "indication": "Psoríase", "stage": "Fase 3", "note_pt": "Design computacional; vendida à Takeda por US$4bi, a maior monetização do tema. Fase 3 positiva."}, {"company": "Structure Tx", "drug": "Aleniglipron", "indication": "Obesidade", "stage": "Fase 2b", "note_pt": "GLP-1 oral desenhado por plataforma estrutural; um dos ativos de IA mais valiosos por estar no mercado de obesidade."}, {"company": "Recursion", "drug": "REC-617", "indication": "Oncologia", "stage": "Fase 1/2", "note_pt": "Após fundir com a Exscientia e podar o pipeline, virou plataforma industrial de descoberta."}], "failures": [{"company": "Exscientia", "drug": "DSP-1181", "indication": "TOC", "fate_pt": "Descontinuado na Fase 1 (2022), velocidade de descoberta não garantiu sucesso clínico."}, {"company": "BenevolentAI", "drug": "BEN-2293", "indication": "Dermatite atópica", "fate_pt": "Falhou a Fase 2a (2023); cortou ~metade do quadro. Marco do 'estouro do hype'."}, {"company": "Recursion", "drug": "REC-994 e outros", "indication": "CCM / meningioma", "fate_pt": "Cortou 4 a 5 programas em 2024 e 2025 por eficácia inconsistente; demissões."}, {"company": "Isomorphic Labs", "drug": "pré-clínicos", "indication": "Onco / imuno", "fate_pt": "Não é falha, mas atraso: prometeu clínica até fim/2025, adiou p/ fim/2026, nem os mais capitalizados chegaram lá."}], "findings_pt": ["O gargalo migrou: a IA melhora muito a Fase 1 (80 a 90% de sucesso vs 40 a 65% histórico, provavelmente por moléculas mais 'druggable' e melhor perfil farmacologico), mas a Fase 2, onde se testa Eficácia e a hipotese biológica do alvo, continua em ~40%, estatisticamente igual ao histórico (~37%). A IA ainda não resolveu o risco de escolher o alvo errado.", "Nenhuma droga totalmente AI-designed foi aprovada até agosto/2026. O marco atual e prova-de-conceito de Fase 2 (rentosertib, Nature Medicine 2025), não aprovação.", "O paper da BCG (Jayatunga et al., Drug Discovery Today, jun/2024) estima que a IA poderia elevar a probabilidade end-to-end de sucesso de 5 a 10% para 9 a 18%, melhora real, mas ainda modesta e dependente de a vantagem de Fase 1 se sustentar em fases tardias.", "Consolidacao e realismo: fusao Recursion+Exscientia (nov/2024), poda de pipelines, demissoes na BenevolentAI e Recursion, e atraso da Isomorphic marcam a transicao do hype (2020 a 2022) para uma fase de execução e ceticismo (2023 a 2026).", "A maior monetizacao ligada ao tema (Nimbus/TYK2 -> Takeda, US$4 bi upfront) veio de design computacional/estrutural, não de 'generative AI de novo', o que mostra que o valor comercial já capturado esta mais em química computacional madura do que em IA generativa pura.", "Vies temporal: a maioria dos programas AI-native entrou na clínica só a partir de 2021 a 2023, entao a ausencia de aprovações também reflete que ainda não houve tempo suficiente para percorrer todo o funil (7 a 10 anos)."], "sources": ["https://intuitionlabs.ai/articles/ai-discovered-drugs-clinical-trials-2026", "https://intuitionlabs.ai/articles/ins018-055-phase-2a-results-ai-designed-drug", "https://www.nature.com/articles/s41591-025-03743-2", "https://www.prnewswire.com/news-releases/insilico-medicine-announces-nature-medicine-publication-of-phase-iia-results-evaluating-rentosertib-the-novel-tnik-inhibitor-for-idiopathic-pulmonary-fibrosis-ipf-discovered-and-designed-with-a-pioneering-ai-approach-302472070.html", "https://www.researchgate.net/publication/380223979_How_successful_are_AI-discovered_drugs_in_clinical_trials_A_first_analysis_and_emerging_lessons", "https://www.benevolent.com/news-and-media/press-releases-and-in-media/benevolentai-announces-top-line-phase-iia-results-its-topical-pan-trk-inhibitor-ben-2293-1-mild-moderate-atopic-dermatitis/", "https://synapse.patsnap.com/drug/a785db59b5d54d209ddfe8619dfcc2b0", "https://www.goodwinlaw.com/en/news-and-events/news/2022/12/12_13-nimbus-announces-sale-of-program-to-takeda", "https://www.biopharmadive.com/news/takeda-zasocitinib-tyk2-psoriasis-drug-results-nimbus/808237/", "https://ir.structuretx.com/news-releases/news-release-details/structure-therapeutics-provides-comprehensive-gsbr-1290-program", "https://www.nature.com/articles/s41591-026-04476-6", "https://www.genengnews.com/topics/artificial-intelligence/recursion-halts-four-pipeline-programs-sharpening-cancer-rare-disease-focus/", "https://www.biopharmadive.com/news/recursion-pipeline-cuts-first-quarter-earnings/747119/", "https://ir.recursion.com/news-releases/news-release-details/recursion-and-exscientia-two-leaders-ai-drug-discovery-space", "https://finance.yahoo.com/news/google-backed-ai-drug-discovery-195423147.html", "https://www.clinicaltrialsarena.com/news/isomorphic-labs-prepares-trials-ai-designed-drugs/"], "caveats_pt": ["Os números do funil variam conforme a DEFINICAO de 'AI-discovered' (IA generativa de novo vs IA de suporte) e conforme a fonte (ASCO 2026: 117 ativos; outros trackers: 150-175 programas). Trate como ordem de grandeza, não contagem exata.", "'Fase X completada' não significa sucesso, inclui trials concluidos com resultado negativo. O afunilamento também reflete tempo (programas jovens ainda não chegaram a fases tardias), não só falha.", "Rentosertib teve Fase 2a POSITIVA mas em amostra pequena (71 pacientes) e conduzida na China; ainda precisa de Fase 2b/3 confirmatoria maior antes de qualquer conclusao sobre eficácia real.", "TAK-279/zasocitinib (ex-Nimbus) e frequentemente citado como 'sucesso de IA', mas foi desenhado por química computacional/estrutural, alguns puristas não o classificam como 'generative AI'. A atribuicao de credito a IA e disputada em varios casos.", "Resultados de readouts recentes (ex.: ACCESS Fase 2b Q4 2025 da Structure) podem ter evoluido após as datas das fontes; confirmar releases mais recentes antes de usar em decisao.", "Números de sucesso de Fase 1 (80 a 90%) vem de amostra ainda pequena de moléculas AI e podem regredir a media conforme o N cresce, alerta explicito no próprio paper da BCG e no artigo do rentosertib na Nature Medicine."]};

do em como o corpo produz glóbulos vermelhos e o pigmento heme. Seu principal remédio, o bitopertin, busca reduzir o acúmulo de uma substância tóxica em pacientes com uma doença rara que os deixa com dor severa ao contato com a luz do sol (protoporfiria eritropoiética, EPP).", "developing": "O programa principal é o bitopertin (pílula) para a EPP. Após um revés com a FDA, a empresa conduz o estudo de fase 3 APOLLO, que pode virar a base para aprovação definitiva. Também testa o bitopertin no estudo de fase 2 RESTORE-PV para policitemia vera (excesso de glóbulos vermelhos).", "next_sem": "No 2S26 espera-se: dados iniciais do estudo RESTORE-PV em policitemia vera no 3º trimestre de 2026; e os dados decisivos de topline do estudo de fase 3 APOLLO (EPP) no 4º trimestre de 2026.", "past_news": [{"date": "fev/2026", "event": "FDA emitiu Carta de Resposta Completa (CRL) recusando a aprovação acelerada do bitopertin para EPP, questionando a ligação do biomarcador com a exposição ao sol", "reaction": "forte queda, cerca de -22% (chegou a -39% intradia)"}, {"date": "jun/2026", "event": "Reunião Tipo A com a FDA: alinhamento de que o estudo de fase 3 APOLLO, se positivo, pode servir de base para aprovação tradicional", "reaction": "recuperação / alívio"}, {"date": "ago/2026", "event": "Resultados do 2º trimestre de 2026 e lançamento de programa de acesso expandido ao bitopertin antes da decisão da FDA", "reaction": "reação moderada"}], "past_results": "Estudos anteriores (fase 2 AURORA/BEACON) mostraram que o bitopertin reduz de forma significativa a protoporfirina IX tóxica no sangue; a FDA aceitou esse dado, mas exigiu comprovar que isso se traduz em maior tolerância ao sol, o que agora depende do APOLLO.", "flag": "Aprovação para EPP foi negada (CRL) em fev/2026; tudo passa a depender do resultado do estudo APOLLO no 4º trimestre de 2026.", "last": 78.77, "ytd": -0.8, "hi52": 94.11, "lo52": 55.95, "liq": "US$ 39 mi/dia", "avgvol": 529348, "series": [[1692106200, 54.15], [16 á entrou em fase pivotal. E o risto-cel (antigo BEAM-101), uma terapia celular para anemia falciforme (doença falciforme), com dosagem já concluída no estudo Fase 1/2 BEACON.", "next_sem": "No 2S26 a Beam iniciou a coorte pivotal global do BEAM-302 na AATD (primeiro paciente já dosado, anunciado no 2º tri de 2026), pela via de aprovação acelerada; a submissão do pedido de aprovação (BLA) do risto-cel para anemia falciforme é esperada já para o fim de 2026.", "past_news": [{"date": "fev/2020", "event": "IPO na Nasdaq", "reaction": "estreia positiva; entusiasmo com a plataforma de edição de base"}, {"date": "mar/2025", "event": "Primeiros dados clínicos positivos do BEAM-302 na AATD, primeira correção genética clínica de uma mutação causadora de doença", "reaction": "misto/negativo no curto prazo (ação caiu ~3 a 5%) apesar de os dados serem considerados marco científico"}, {"date": "abr/2025", "event": "Dados adicionais do BEAM-302: queda média de ~79% da proteína mutante Z-AAT", "reaction": "recepção positiva, reforçou a tese"}], "past_results": "O BEAM-302 elevou os níveis de AAT total e funcional acima do limiar protetor e reduziu a proteína mutante Z-AAT em até ~78 a 79%, com bom perfil de segurança, levando a empresa a escolher a dose de 60 mg para a fase pivotal. Na anemia falciforme (risto-cel), a dosagem foi concluída em todos os pacientes adultos e adolescentes do BEACON.", "flag": "Ainda sem produto aprovado e queima de caixa alta; resultado depende de execução clínica e regulatória de terapias genéticas complexas.", "last": 25.97, "ytd": -6.3, "hi52": 37.92, "lo52": 16.01, "liq": "US$ 67 mi/dia", "avgvol": 2180518, "series": [[1692106200, 24.27], [1692192600, 23.21], [1692279000, 23.49], [1692365400, 23.34], [1692624600, 23.7], [1692711000, 23.3], [1692797400, 23.5], [1692883800, 23.06], [1692970200, 23.21], [1693229400, 23.43], [1693315800, 23.72], [1693402200, 23.51], [1693488600, 23.18], [1693575000, 23.46], [1693920600, 23.68], [1694007000, 24.66], [169 const TAB3={"timeline": [{"year": "2005", "drug": "Exenatida (Byetta)", "company": "Amylin Pharmaceuticals / Eli Lilly", "milestone_pt": "Primeiro agonista de receptor GLP-1 aprovado pelo FDA (abr/2005), para diabetes tipo 2. Derivado da exendina-4 (saliva do lagarto Gila monster). Injeção 2x/dia. Abriu a classe, mas a perda de peso era vista como 'efeito colateral' secundário ao controle glicêmico.", "weight_loss": "~2% a 3% de redução de peso (ainda não era a proposta)"}, {"year": "2010", "drug": "Liraglutida (Victoza)", "company": "Novo Nordisk", "milestone_pt": "GLP-1 diario aprovado para diabetes tipo 2 (2010). Molécula da Novo, base do futuro domínio da empresa na classe. Já mostrava perda de peso consistente em trials de diabetes, plantando a semente da tese de obesidade.", "weight_loss": "~4 a 6% em diabeticos"}, {"year": "2012", "drug": "Exenatida semanal (Bydureron) / Byetta", "company": "Amylin -> Bristol-Myers Squibb/AstraZeneca", "milestone_pt": "Bydureron (exenatida de liberacao prolongada, 1x/semana) reforcava a tendência de dosagem semanal. Ativo central da aquisição da Amylin pela BMS em 2012 (ver M&A).", "weight_loss": "~2 a 4%"}, {"year": "2014", "drug": "Dulaglutida (Trulicity)", "company": "Eli Lilly", "milestone_pt": "GLP-1 semanal da Lilly aprovado (set/2014) para diabetes tipo 2. Foi o motor de crescimento da Lilly na classe e a base comercial que permitiu financiar o tirzepatida. Atingiu ~US$7,4 bi de receita anual em 2022.", "weight_loss": "~3 a 4%"}, {"year": "2014", "drug": "Liraglutida 3,0 mg (Saxenda)", "company": "Novo Nordisk", "milestone_pt": "Primeiro GLP-1 aprovado pelo FDA explicitamente para OBESIDADE/controle de peso (dez/2014), mesma molécula da Victoza em dose maior. Marco: a indústria assumiu a obesidade como indicacao própria, ainda que a magnitude fosse modesta.", "weight_loss": "~5 a 8%"}, {"year": "2017", "drug": "Semaglutida (Ozempic)", "company": "Novo Nordisk", "milestone_pt": "GLP-1 semanal para diabetes aprovado (dez/2017). Perda de peso claramente superior a geração anterior nos trials de diabetes (SUSTAIN). Tornou-se o produto que redefiniu o setor e catapultou a Novo.", "weight_loss": "~6 a 10% (em trials de diabetes)"}, {"year": "2019", "drug": "Semaglutida oral (Rybelsus)", "company": "Novo Nordisk", "milestone_pt": "Primeiro GLP-1 ORAL aprovado (2019), prova de conceito de que a barreira da injeção poderia cair, ampliando drasticamente o mercado endereçável futuro.", "weight_loss": "~4 a 6%"}, {"year": "2021", "drug": "Semaglutida 2,4 mg (Wegovy)", "company": "Novo Nordisk", "milestone_pt": "Aprovado para obesidade (jun/2021). O trial STEP 1 (NEJM, fev/2021) mostrou ~15% de perda de peso, patamar antes só alcancado por cirurgia bariátrica. Este foi o ponto de inflexão clínico da tese de obesidade.", "weight_loss": "~15% (STEP 1, -14,9% vs -2,4% placebo em 68 semanas)"}, {"year": "2022", "drug": "Tirzepatida (Mounjaro)", "company": "Eli Lilly", "milestone_pt": "Primeiro agonista DUPLO GIP/GLP-1, aprovado para diabetes tipo 2 (mai/2022). Em jun/2022, o trial de obesidade SURMOUNT-1 (NEJM/ADA) mostrou ~20-22,5% de perda de peso, elevando de novo o teto e confirmando a corrida de duas empresas.", "weight_loss": "~20% (SURMOUNT-1: 16,0% a 22,5% conforme dose)"}], "graveyard": [{"drug": "Fen-phen (fenfluramina + fentermina)", "company": "Wyeth (American Home Products)", "year": "1997", "fate_pt": "Combinação muito popular nos anos 90, retirada em 1997 após casos de <b>valvulopatia cardíaca e hipertensão pulmonar</b>. Gerou mais de <b>50 mil processos</b> e mais de <b>US$13 bi em acordos</b>. Trauma fundador que fez a obesidade virar sinônimo de <b>risco cardíaco e passivo jurídico</b>."}, {"drug": "Rimonabanto (Acomplia)", "company": "Sanofi-Aventis", "year": "2006 a 2008", "fate_pt": "Bloqueador do receptor canabinoide, aprovado na Europa em 2006 e saudado como inovador. Causou <b>depressão e ideação suicida</b>, foi retirado em 2008 e <b>nunca aprovado nos EUA</b>. Reforçou a percepção de que emagrecer agindo no cérebro tinha <b>efeitos psiquiátricos perigosos</b>."}, {"drug": "Lorcaserina (Belviq)", "company": "Arena Pharmaceuticals / Eisai", "year": "2012 a 2020", "fate_pt": "Agonista serotoninérgico 5-HT2C aprovado em 2012 como seguro. O FDA pediu a retirada em 2020 depois de um estudo de longo prazo mostrar <b>aumento de risco de câncer</b>. Emblemático: mesmo o que passava era retirado anos depois, o setor parecia amaldiçoado."}, {"drug": "Qsymia (fentermina + topiramato)", "company": "Vivus", "year": "2012", "fate_pt": "Aprovado em 2012, mas com <b>eficácia modesta</b>, <b>restrições de REMS</b> (risco de malformação fetal) e <b>lançamento comercial fraco</b>. Sobreviveu no mercado, mas sem tração, exemplo de produto que funciona um pouco e não muda o jogo."}, {"drug": "Contrave (naltrexona + bupropiona)", "company": "Orexigen Therapeutics / Takeda", "year": "2014", "fate_pt": "Aprovado em 2014, com <b>eficácia modesta (~5%)</b>, <b>problemas de execução comercial</b> e <b>disputas sobre os dados de segurança cardiovascular</b>. A Orexigen acabou em <b>falência (2018)</b>. Confirmou que combinar moléculas antigas não resolvia o problema."}], "diabetes_era_winners_pt": ["Novo Nordisk foi a grande vencedora ANTES da obesidade: construiu franquia dominante de GLP-1 para diabetes com Victoza (2010) e depois Ozempic (2017). A carteira de GLP-1 para diabetes (Victoza + Ozempic + Rybelsus) cresceu de forma acelerada na segunda metade da decada de 2010, tornando-a líder global da classe (>50% de share de valor).", "Eli Lilly foi a segunda vencedora com Trulicity (dulaglutida, 2014): vendas trimestrais globais triplicaram de ~US$112 mi no 4T2015 para patamar de bilhões; Trulicity chegou a ~US$7,4 bi de receita anual em 2022, o caixa que financiou o desenvolvimento do tirzepatida.", "O ponto-chave para um investidor: entre ~2015 e 2021, o crescimento já era EXPLOSIVO, mas ainda 'vestido' de diabetes. A tese de obesidade estava sendo pre-financiada e pre-validada dentro da franquia de diabetes, sem que o mercado precificasse o TAM de obesidade.", "AstraZeneca e Bristol-Myers Squibb entraram via Byetta/Bydureron (Amylin), mas ficaram para tras, a exenatida foi ofuscada pelas moléculas semanais mais potentes da Novo e da Lilly, mostrando que estar na classe não bastava; a molécula certa importava.", "Sanofi tentou (lixisenatida/Adlyxin e a combinação Soliqua) mas nunca liderou; acabou saindo do foco em diabetes, ilustrando a divergencia: dois vencedores claros (Novo, Lilly) e varios perdedores na mesma classe."], "prior_ma": [{"acquirer": "Bristol-Myers Squibb (com AstraZeneca)", "target": "Amylin Pharmaceuticals", "value": "~US$7 bi (US$5,3 bi em ações a US$31 por ação, mais ~US$1,7 bi de dívida líquida e obrigação contratual com a Eli Lilly)", "year": "2012", "note_pt": "Trouxe a franquia de GLP-1 exenatida (Byetta e Bydureron) e a pranlintida (Symlin). A AstraZeneca financiou ~US$3,4 bi da sua parte. Foi o <b>grande M&amp;A de GLP-1 do período</b>, mas <b>apostou na molécula errada</b>, a exenatida, que perdeu para liraglutida e semaglutida. Lição: <b>pagar caro pela classe não garante o ativo vencedor</b>."}, {"acquirer": "Sanofi", "target": "Lexicon Pharmaceuticals (colaboração)", "value": "~US$300 mi de upfront (acordo de colaboração, 2015)", "year": "2015", "note_pt": "Parceria em torno da sotagliflozina (inibidor SGLT1/2 para diabetes). <b>Terminou mal</b>: a Sanofi devolveu os direitos e o <b>FDA rejeitou o produto em 2019</b>. Exemplo de aposta em diabetes <b>fora do eixo GLP-1</b> que não deu certo."}, {"acquirer": "Novo Nordisk", "target": "Desenvolvimento interno (não M&A) e aquisições pequenas", "value": "n/a", "year": "2005 a 2021", "note_pt": "Contraste importante: os dois vencedores, Novo e Lilly, <b>construíram as moléculas vencedoras internamente</b>, não por grandes aquisições. O valor foi criado em <b>P&amp;D próprio</b>, não em M&amp;A, sinal de que a vantagem era <b>científica e de plataforma, difícil de comprar</b>."}, {"acquirer": "Takeda", "target": "Orexigen (via licenciamento do Contrave)", "value": "acordo de comercialização (posteriormente desfeito)", "year": "2010 a 2016", "note_pt": "A Takeda licenciou o Contrave e depois devolveu, e a Orexigen <b>faliu em 2018</b>. Representa o <b>capital queimado na era do cemitério</b> da obesidade, alimentando o ceticismo dos investidores."}], "leading_indicators_pt": ["A ESCADA da perda de peso ao longo das gerações (visivel já em 2017 a 2018): exenatida ~2 a 3% -> liraglutida ~5 a 8% -> semaglutida ~10 a 15% -> tirzepatida ~20%+. Cada nova molécula batia a anterior de forma consistente. Um observador atento veria uma curva de eficácia claramente ascendente e não aleatoria, o padrão de uma plataforma que estava melhorando, não de sorte pontual.", "Os trials de desfecho cardiovascular em DIABETES já em 2016 (LEADER, liraglutida: -13% em eventos CV; SUSTAIN-6, semaglutida: -26%). Isso mostrava que a classe não só era segura no coracao (ao contrario de fen-phen/rimonabanto/lorcaserina) como PROTEGIA, matando a maldicao histórica da obesidade e abrindo o caminho regulatório e de reembolso.", "O lancamento do Saxenda (dez/2014) como indicacao formal de obesidade: sinal de que a maior farma de diabetes já tratava obesidade como mercado próprio, mesmo com eficácia modesta, o comprometimento estratégico veio anos antes do produto 'matador'.", "Os programas de Fase 3 DEDICADOS a obesidade (STEP para semaglutida, SURMOUNT para tirzepatida) rodando ~2018 a 2021: a simples existencia desses programas dizia que as empresas estavam apostando pesado. O readout do STEP 1 (fev/2021, ~15%) foi O sinal inequivoco, patamar de cirurgia bariátrica em pilula/injeção.", "O tamanho do mercado endereçável: obesidade atinge ~40% dos adultos nos EUA vs ~11% para diabetes, ou seja, o mesmo mecanismo tinha um TAM potencialmente ~4x maior, ainda quase todo por precificar. Esse calculo simples de prevalencia estava disponível para qualquer um desde sempre.", "O trial SELECT (iniciado em 2018, com readout esperado ~2023): desenhado para provar beneficio cardiovascular da semaglutida em obesos SEM diabetes. Sua mera existencia e cronograma eram um catalisador conhecido e datavel, sinalizava que a Novo miraria reembolso/payers no publico de obesidade, o gatilho para volume massivo.", "Demanda off-label e viralizacao em redes sociais (2021 a 2022): mesmo antes do Wegovy escalar produção, já havia uso off-label de Ozempic para emagrecer e buzz social/celebridades. Sinal de demanda de consumo (não só medica), raro e poderoso em farma, indicando que a restrição seria oferta, não demanda."], "pattern_pt": ["O 'beta' da tese estava ESCONDIDO dentro de uma franquia adjacente já lucrativa: o crescimento de obesidade foi pre-validado e pre-financiado pela franquia de GLP-1 para DIABETES (2010 a 2021) antes de o mercado precificar o TAM muito maior de obesidade. Playbook: procurar o produto cujo caso de uso maior ainda esta 'disfarcado' do caso de uso menor onde ele já e vendido.", "Curva de eficácia monotonicamente crescente entre gerações de produto e o sinal mais forte de plataforma (não de acaso). Quando cada nova versao supera a anterior de forma sistematica (2 a 3% -> 8% -> 15% -> 20%), aposte na plataforma/empresa, não no produto atual, a próxima geração tende a manter a trajetoria.", "Um catalisador de derrubada de risco datavel e conhecido vale ouro: aqui foram os trials de desfecho cardiovascular (LEADER/SUSTAIN-6 em 2016; SELECT com readout ~2023) que mataram a 'maldicao' histórica do setor. Playbook: mapear qual leitura de dados converte um setor de 'proibido/arriscado' para 'reembolsavel/mainstream', e a data em que ela sai.", "Ceticismo estrutural do mercado (o 'cemiterio da obesidade': fen-phen, rimonabanto, lorcaserina) cria a assimetria: quanto mais um setor tem histórico de fracassos traumaticos, mais barato fica o ativo que finalmente resolve o problema, porque quase ninguem acredita. A tese mais lucrativa e a certa num setor que todos abandonaram.", "Demanda de consumo espontanea (off-label + redes sociais) antes da oferta escalar indica que o gargalo será produção, não adocao, o cenario ideal de pricing power. Playbook: sinais de demanda 'puxada' pelo paciente/consumidor (não empurrada por marketing) são raros em farma e antecedem receitas explosivas.", "Dois vencedores claros numa classe com muitos participantes (Novo e Lilly com moléculas próprias, vs Amylin/BMS, Sanofi, Orexigen que falharam) mostram que a vantagem era de P&D/plataforma e não comoditizavel via M&A. Playbook: quando os vencedores constroem internamente e não conseguem ser comprados, concentre a aposta neles."], "sources": ["https://plexusdx.com/blogs/learn/history-of-glp-1-drugs-plexusdx", "https://therxindex.com/guides/glp-1-fda-approvals-timeline/", "https://www.genre.com/us/knowledge/publications/2025/september/glp-1-receptor-agonists-from-evolution-to-revolution-en", "https://www.medicspot.co.uk/weight-loss/medication/glp1-clinical-trials-summary", "https://www.nejm.org/doi/full/10.1056/NEJMoa2032183", "https://www.prnewswire.com/news-releases/lillys-surmount-1-results-published-in-the-new-england-journal-of-medicine-show-tirzepatide-achieved-between-16-0-and-22-5-weight-loss-in-adults-with-obesity-or-overweight-301561327.html", "https://www.pharmexec.com/view/evolution-obesity-drugs-failures-glp1", "https://achi.net/newsroom/weight-loss-drugs-a-historical-review-part-2/", "https://news.bms.com/news/details/2012/Bristol-Myers-Squibb-Completes-Acquisition-of-Amylin-Pharmaceuticals-Inc/default.aspx", "https://www.fiercepharma.com/pharma/bristol-myers-squibb-and-astrazeneca-expand-diabetes-alliance-through-bristol-myers-squibb-s", "https://www.tctmd.com/news/liraglutide-leaps-over-fda-safety-hurdle-cardiovascular-mortality-reduction-boot-leader", "https://www.acc.org/Latest-in-Cardiology/Clinical-Trials/2023/11/09/15/04/select", "https://www.nejm.org/doi/pdf/10.1056/NEJMoa2307563", "https://www.drugs.com/history/trulicity.html", "https://www.drugdiscoverytrends.com/how-lilly-is-narrowing-the-glp-1-revenue-divide-with-novo-nordisk-in-charts/", "https://annualreport.novonordisk.com/2024/strategic-aspirations/financials.html", "https://en.wikipedia.org/wiki/Anti-obesity_medication", "https://finance.yahoo.com/news/novo-nordisk-regains-crown-europes-090754213.html"], "caveats_pt": ["Datas referem-se a aprovações do FDA (EUA), salvo indicacao (ex.: rimonabanto foi aprovado na Europa, nunca nos EUA). Aprovações em outras jurisdicoes podem diferir.", "Percentuais de perda de peso são aproximados e dependem de dose, duracao e populacao (diabeticos vs não-diabeticos); comparacoes entre gerações usam trials distintos, não head-to-head, exceto SURMOUNT-5 (tirzepatida vs semaglutida).", "O trial SELECT foi iniciado em 2018, mas seus resultados só foram divulgados em 2023 (fora da janela pre-Mounjaro). No período 2005 a 2022 ele valia como catalisador FUTURO conhecido, não como dado já disponível, a distincao importa para 'o que era visivel quando'.", "O valor de ~US$7 bi da Amylin inclui equity (~US$5,3 bi) + divida líquida e obrigacao com a Lilly (~US$1,7 bi); números arredondados.", "Cifras de receita (ex.: Trulicity ~US$7,4 bi em 2022) são pontuais e ilustrativas; series completas de 2015 a 2021 não foram totalmente reconstruidas aqui.", "Este material e histórico/factual para análise de mercado e Não constitui recomendacao de investimento."]}, GLP1={"glp1_pubs": {"1990": 40, "1993": 90, "1996": 180, "1999": 300, "2002": 420, "2005": 620, "2008": 850, "2011": 1150, "2014": 1450, "2017": 1750, "2020": 2200, "2021": 2600, "2022": 3200, "2023": 4100, "2024": 5200, "2025": 5800}, "launches": [{"drug": "Byetta", "generic": "exenatide", "company": "Amylin/Eli Lilly", "year": 2005, "indication": "Diabetes tipo 2 (2x/dia)"}, {"drug": "Victoza", "generic": "liraglutide", "company": "Novo Nordisk", "year": 2010, "indication": "Diabetes tipo 2 (1x/dia)"}, {"drug": "Trulicity", "generic": "dulaglutide", "company": "Eli Lilly", "year": 2014, "indication": "Diabetes tipo 2 (1x/semana)"}, {"drug": "Saxenda", "generic": "liraglutide", "company": "Novo Nordisk", "year": 2014, "indication": "Obesidade (liraglutida 3mg, 1x/dia)"}, {"drug": "Ozempic", "generic": "semaglutide", "company": "Novo Nordisk", "year": 2017, "indication": "Diabetes tipo 2 (1x/semana)"}, {"drug": "Wegovy", "generic": "semaglutide", "company": "Novo Nordisk", "year": 2021, "indication": "Obesidade (semaglutida 2.4mg, 1x/semana)"}, {"drug": "Mounjaro", "generic": "tirzepatide", "company": "Eli Lilly", "year": 2022, "indication": "Diabetes tipo 2 (agonista duplo GIP/GLP-1, 1x/semana)"}, {"drug": "Zepbound", "generic": "tirzepatide", "company": "Eli Lilly", "year": 2023, "indication": "Obesidade (agonista duplo GIP/GLP-1, 1x/semana)"}], "victoza_vs_ozempic_pt": "Ambos são GLP-1 da Novo Nordisk, mas separados por ~7 anos de evolucao molecular. Victoza (liraglutida, 2010) e injeção DIARIA e tem meia-vida curta (~13h). Ozempic (semaglutida, 2017) foi reengenhado para durar muito mais (meia-vida ~7 dias) permitindo aplicacao SEMANAL, e e substancialmente mais POTENTE tanto no controle glicêmico quanto na perda de peso. Na pratica, a semaglutida e a segunda geração que tornou a liraglutida obsoleta comercialmente: mesma classe, mas conveniencia (1x/semana vs 1x/dia) e eficácia bem superiores. A semaglutida também viabilizou versao oral (Rybelsus) e a dose alta para obesidade (Wegovy), coisas que a liraglutida só alcancava parcialmente (Saxenda diaria).", "trulicity_vs_tirz_pt": "Ambos são injetaveis semanais da Eli Lilly, mas de mecanismos diferentes. Trulicity (dulaglutida, 2014) e um agonista de GLP-1 PURO (mono-agonista), atua num único receptor de incretina. Tirzepatide (Mounjaro 2022 / Zepbound 2023) e um agonista DUPLO (twincretin): ativa ao mesmo tempo os receptores de GIP e de GLP-1, dois hormonios incretinicos. Essa acao dual entrega redução de HbA1c e, principalmente, perda de peso significativamente maiores que a de qualquer mono-agonista GLP-1 (incluindo a própria semaglutida em comparacoes diretas). Ou seja: a Trulicity e a geração GLP-1 mono da Lilly; a tirzepatida e o salto seguinte, o duplo GIP/GLP-1 que colocou a Lilly na lideranca de eficácia da classe.", "boom_lag_pt": ["Restrição de oferta: após a aprovação (Wegovy 2021, Mounjaro 2022) a demanda superou brutalmente a capacidade fabril; faltou capacidade de fill-finish (envase de canetas), gerando shortage e limitando o quanto de receita as empresas conseguiam de fato reconhecer no inicio.", "SELECT trial (ago/2023): o desfecho cardiovascular da semaglutida mostrou ~20% de redução de MACE (morte CV, infarto, AVC) em obesos SEM diabetes. Isso transformou a tese de 'droga estetica/lifestyle' em 'droga que reduz eventos cardiovasculares', abrindo caminho para cobertura por seguros/planos, o gatilho que re-ratou as acoes em 2023.", "Demanda viral por midia social: TikTok/Instagram e celebridades popularizaram Ozempic/Wegovy em 2022 a 2023, criando demanda de consumo massiva além do publico diabetico original.", "Expansao de indicacoes e ampliacao do TAM: obesidade, risco cardiovascular, e depois apneia do sono, doenca renal, MASH etc., o mercado endereçável deixou de ser 'diabeticos' e passou a ser 'centenas de milhões de pessoas com sobrepeso', justificando revisao radical das projecoes de receita e dos multiplos.", "Prova de escalabilidade financeira: só em 2023 a 2024, com as fábricas expandindo e a receita efetivamente entrando nos resultados trimestrais, o mercado confirmou que a demanda era estrutural e não moda passageira, validando o re-rating (Novo e Lilly viraram as empresas mais valiosas da Europa e do setor de saúde, respectivamente).", "Resumo do lag: aprovação (2021) e ciência/capacidade (2022 a 2023) vieram ANTES da confirmacao de (a) que pagadores cobririam, (b) que havia beneficio de mortalidade/CV, e (c) que a oferta escalaria, e foi essa triade, materializada em 2023 a 2024, que destravou a explosao das acoes."], "diabetes_to_obesity_pt": ["A perda de peso Não foi totalmente acidental, mas também não foi o alvo original: os GLP-1 foram desenvolvidos para diabetes tipo 2 (controle glicêmico via secrecao de insulina glicose-dependente).", "Efeito 'colateral' observado cedo: nos ensaios de diabetes (Byetta, Victoza) notou-se que os pacientes perdiam peso de forma consistente, o GLP-1 atua também no cerebro reduzindo apetite e retardando o esvaziamento gastrico (saciedade).", "De observacao a estratégia deliberada: a Novo entao investigou a dose ALTA especificamente para obesidade, primeiro Saxenda (liraglutida 3mg, 2014), depois Wegovy (semaglutida 2.4mg, 2021), com ensaios (STEP) desenhados para perda de peso como desfecho primario.", "Portanto: o insight (GLP-1 emagrece) foi serendipico/observacional na origem diabetica, mas a conversao em mercado de obesidade foi uma aposta deliberada de P&D e regulatória, escalar dose, rodar trials de obesidade e buscar indicacao própria.", "O ponto de virada de mercado veio quando a eficácia de perda de peso alcancou patamar 'cirurgia-bariátrica-like' (~15% com semaglutida, >20% com tirzepatida), tornando o fármaco uma alternativa real a cirurgia, algo que os anorexígenos antigos nunca entregaram."], "pre2021_max_wl_pt": "O teto era ~10%: orlistate ~3%, Contrave ~6%, Saxenda ~6 a 8% e, no melhor caso, Qsymia ~9 a 10%. A semaglutida levou para ~15% e a tirzepatida para ~20%. Depois disso o SELECT ainda mostrou redução de eventos cardiovasculares, algo que nenhum dos antigos tinha. Antes, perda maior só com cirurgia bariátrica.", "sources": ["https://therxindex.com/guides/glp-1-fda-approvals-timeline/", "https://www.drugs.com/history/zepbound.html", "https://www.cardiometabolichealth.org/article/zepbound-is-approved-by-fda-for-obesity/", "https://www.sciencedirect.com/science/article/abs/pii/S2451847625000600", "https://www.nature.com/articles/s41392-024-01931-z", "https://www.docwirenews.com/post/select-trial-semaglutide-reduces-cardiovascular-events-independent-of-weight-loss", "https://www.thelancet.com/journals/lancet/article/PIIS0140-6736(24)01498-3/fulltext", "https://www.pharmacytimes.com/view/which-weight-loss-drug-works-best", "https://www.aafp.org/pubs/afp/issues/2022/0700/poems-weight-loss-drugs.html"], "caveats_pt": ["A serie glp1_pubs e uma APROXIMACAO grosseira do volume anual de publicações do campo GLP-1/incretina no PubMed, os números exatos dependem da string de busca e da data de indexacao; use apenas para ilustrar a curva de crescimento, não como contagem oficial.", "2025 esta incompleto/parcial (ano corrente na data da pesquisa, ~ago/2026 os dados de 2025 ainda podem estar sendo indexados).", "A inflexão clara da curva de publicações ocorre a partir de ~2021 a 2023, acompanhando as indicacoes de obesidade e os dados cardiovasculares (SELECT).", "Anos de aprovação referem-se ao primeiro aval do FDA nos EUA para a indicacao citada; aprovações em outras regioes (EMA etc.) e ampliacoes de indicacao ocorreram em datas distintas.", "Saxenda e Victoza são a mesma molécula (liraglutida) em doses diferentes; Ozempic/Wegovy/Rybelsus são a mesma molécula (semaglutida) em doses/vias diferentes; Mounjaro e Zepbound são a mesma molécula (tirzepatida).", "Comparacoes de potencia/perda de peso entre moléculas variam conforme dose e ensaio; os percentuais citados são ordens de grandeza tipicas da literatura, não head-to-head universais.", "Este material e histórico/informativo e Não constitui recomendacao medica nem de investimento."]}, NVLLY={"series": [{"name": "Lilly", "col": "var(--accent)", "data": [[1420520400, 56.68], [1421125200, 57.71], [1421730000, 58.87], [1422334800, 58.53], [1422939600, 56.83], [1423544400, 58.02], [1424149200, 58.46], [1424754000, 58.48], [1425358800, 57.21], [1425960000, 58.44], [1426564800, 62.79], [1427169600, 60.74], [1427774400, 58.64], [1428379200, 60.45], [1428984000, 59.54], [14
